<script>
(async function(){
// ---------- đăng nhập và quyền ----------
const ME=await Auth.requireAuth();
if(!ME.role){location.replace('login.html');return}
// Tồn kho là trang riêng (tonkho.html), không phải một màn của trang này.
const ALLOWED=(Auth.VIEWS[ME.role]||[]).filter(v=>v!=='tonkho');
const SEE_STOCK=(Auth.VIEWS[ME.role]||[]).includes('tonkho');
// Vai trò kho: mở thẳng trang Tồn kho khi vào bảng điều hành không kèm màn cụ thể.
if(ME.role==='kho'&&!(location.hash||'').slice(1)){location.replace('tonkho.html');return}
const sbc=Auth.sb;
const $=s=>document.querySelector(s);
Shell.render(ME,'index');
// Giá vốn, lãi gộp chỉ hiện cho admin, quản lý, kế toán (database cũng chỉ trả số cho các vai trò này).
const SEE_COST=['admin','lanh_dao','quan_ly','ke_toan'].includes(ME.role);
document.documentElement.classList.remove('auth-pending');

// ---------- tiện ích ----------
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=new Intl.NumberFormat('vi-VN');
const N=v=>nf.format(Math.round(v||0));
// Tiền: luôn hiện đủ số đồng (VD 406.429.127), không rút gọn tr / tỷ.
function M(v){v=v||0;return (v<0?'−':'')+N(Math.abs(v))}
const PF=v=>String(v).replace('.',',');
const U=v=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:2}).format(v||0);
const P=(v,d=1)=>isFinite(v)?(v*100).toFixed(d).replace('.',',')+'%':'–';
const store={get(k,d){try{const v=localStorage.getItem('tv_'+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('tv_'+k,v)}catch(e){}}};
const byId=(l,id)=>l.find(x=>x.id===id);

// ---------- danh mục ----------
let CAT={projects:[],teams:[],markets:[],channels:[],staff:[]},catErr='';
try{CAT=await Auth.loadCatalog()}catch(e){catErr=e.message}
let PHP=(byId(CAT.markets,'ph')||CAT.markets[0]||{rate_vnd:403}).rate_vnd;
const projName=id=>id?(byId(CAT.projects,id)||{name:'(dự án đã xoá)'}).name:'(chưa gán dự án)';
const teamName=id=>id?(byId(CAT.teams,id)||{name:'(team đã xoá)'}).name:'(chưa gán team)';
const staffName=(id,fallback)=>id?(byId(CAT.staff,id)||{name:fallback||'(nhân sự đã xoá)'}).name:(fallback?fallback+' · chưa khai báo':'(không có marketer)');
const chName=id=>id?(byId(CAT.channels,id)||{name:id}).name:'Chưa xác định';
const chColor=id=>(byId(CAT.channels,id)||{color:'#8a9289'}).color;
const chTag=id=>`<span class="ch"><span class="dot" style="background:${esc(chColor(id))}"></span>${esc(chName(id))}</span>`;
$('#sideFoot').innerHTML=CAT.markets.map(m=>`${esc(m.name)}: 1 ${esc(m.currency)} = ${N(m.rate_vnd)} đ`).join('<br>');

// ---------- bộ lọc ----------
// Ngày luôn dạng dd/mm và dd/mm/yyyy, không phụ thuộc trình duyệt.
const p2=n=>String(n).padStart(2,'0');
const fmtD=d=>p2(d.getDate())+'/'+p2(d.getMonth()+1);
const fmtDY=d=>fmtD(d)+'/'+d.getFullYear();
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function sod(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const RANGES={today:'Hôm nay',yesterday:'Hôm qua','7d':'7 ngày',month:'Tháng này',lastmonth:'Tháng trước','30d':'30 ngày',custom:'Tuỳ chọn'};
// Gửi ngày cho database: nửa đêm giờ Việt Nam của ngày đã chọn. Database đổi ra ngày (yyyy-mm-dd)
// rồi lọc đơn theo ngày tạo tính bằng giờ của từng thị trường, nên người xem ở múi giờ nào cũng ra cùng số.
const dayISO=d=>new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-7*36e5).toISOString();
function rangeDates(k){
  k=k||F.range;const t=sod(new Date());
  if(k==='today')return [t,addD(t,1)];
  if(k==='yesterday')return [addD(t,-1),t];
  if(k==='7d')return [addD(t,-6),addD(t,1)];
  if(k==='30d')return [addD(t,-29),addD(t,1)];
  if(k==='90d')return [addD(t,-89),addD(t,1)];
  if(k==='lastmonth')return [new Date(t.getFullYear(),t.getMonth()-1,1),new Date(t.getFullYear(),t.getMonth(),1)];
  if(k==='custom'&&F.from&&F.to){const a=sod(new Date(F.from+'T00:00:00')),b=sod(new Date(F.to+'T00:00:00'));return a<=b?[a,addD(b,1)]:[b,addD(a,1)]}
  return [new Date(t.getFullYear(),t.getMonth(),1),addD(t,1)];
}
// Kỳ so sánh: tháng này ↔ cùng số ngày đầu tháng trước; tháng trước ↔ tháng trước nữa; còn lại ↔ đúng bằng ấy ngày ngay trước.
function prevDates(){
  const [f,t]=rangeDates(),n=Math.round((t-f)/864e5);
  if(F.range==='month'){const pf=new Date(f.getFullYear(),f.getMonth()-1,1),pe=new Date(f.getFullYear(),f.getMonth(),1);return [pf,addD(pf,n)>pe?pe:addD(pf,n)]}
  if(F.range==='lastmonth')return [new Date(f.getFullYear(),f.getMonth()-1,1),f];
  return [addD(f,-n),f];
}
function cmpLabel(){return {month:'cùng kỳ tháng trước',lastmonth:'tháng trước đó',today:'hôm qua',yesterday:'hôm kia','7d':'7 ngày trước đó','30d':'30 ngày trước đó'}[F.range]||'kỳ trước'}
function rangeLabel(){const [f,t]=rangeDates();const l=addD(t,-1);return +l===+f?fmtDY(f):`${fmtD(f)} – ${fmtDY(l)}`}
// Dự án người này được chọn: toàn công ty thấy hết; theo dự án thấy dự án được gán.
const projOpts=ME.scope==='all'?CAT.projects:ME.scope==='project'?CAT.projects.filter(p=>(ME.project_ids||[]).includes(p.id)):[];
// Bộ lọc nằm trong đường link (#tongquan?r=month&p=…) để gửi link là mở đúng màn; không có thì lấy lần dùng trước.
const HP=new URLSearchParams((location.hash.split('?')[1])||'');
const F={proj:HP.get('p')??store.get('proj',''),mkt:HP.get('m')??store.get('mkt',''),ch:HP.get('c')??store.get('ch2','all'),
  range:HP.get('r')??store.get('range',ME.scope==='self'?'today':'month'),from:HP.get('f')??store.get('from',''),to:HP.get('t')??store.get('to',''),cmp:(HP.get('cmp')??store.get('cmp','1'))!=='0'};
if(F.proj&&!projOpts.some(p=>p.id===F.proj))F.proj='';
if(!RANGES[F.range]&&F.range!=='90d')F.range='month';
if(F.range==='custom'&&!(F.from&&F.to))F.range='month';
// Kênh / thị trường chọn được nhiều: lưu dạng 'fb,__none' ('__none' = chưa xác định kênh).
const cleanList=(v,ok)=>String(v||'').split(',').filter(x=>x&&ok(x)).join(',');
F.ch=F.ch==='all'?'all':(cleanList(F.ch,x=>x==='__none'||byId(CAT.channels,x))||'all');
F.mkt=cleanList(F.mkt,x=>byId(CAT.markets,x));
const fList=k=>!F[k]||F[k]==='all'?[]:F[k].split(',');
const chLabel=id=>id==='__none'?'Chưa xác định kênh':chName(id);
function hashFor(v){
  const q=new URLSearchParams();if(F.proj)q.set('p',F.proj);if(F.mkt)q.set('m',F.mkt);if(F.ch!=='all')q.set('c',F.ch);
  if(F.range!=='month')q.set('r',F.range);if(F.range==='custom'){q.set('f',F.from);q.set('t',F.to)}if(!F.cmp)q.set('cmp','0');
  const s=q.toString();return '#'+v+(s?'?'+s:'');
}
function scopeLabel(){
  if(ME.scope==='team')return 'Team '+esc(teamName(ME.team_id).replace(/^Team /,''));
  if(ME.scope==='self')return 'Số của '+esc(staffName(ME.staff_id));
  return '';
}
const isDefault=()=>!F.proj&&!F.mkt&&F.ch==='all'&&F.range===(ME.scope==='self'?'today':'month');
// Ô chọn nhiều (kênh, thị trường): bấm mở danh sách tích chọn, "Áp dụng" hoặc bấm ra ngoài để lọc, Esc / "Huỷ" để bỏ.
let MP=null;
function msel(k,label,allTxt,opts){
  const cur=fList(k),open=!!(MP&&MP.k===k),sel=open?MP.sel:cur,nm=id=>(opts.find(o=>o[0]===id)||[id,id])[1];
  const txt=!cur.length?allTxt:cur.length<=2?cur.map(nm).join(', '):cur.length+' '+label.toLowerCase();
  return `<div class="msel${cur.length?' on':''}"><button type="button" class="mbtn" data-mopen="${k}" aria-haspopup="true" aria-expanded="${open}" aria-label="${esc(label+': '+txt)}" title="${esc(label+': '+txt)}"><span>${esc(txt)}</span>${cur.length>2?`<b class="mcnt">${cur.length}</b>`:''}</button>${open?`<div class="mpop" role="group" aria-label="Chọn ${esc(label.toLowerCase())}">
    <label class="mopt mall"><input type="checkbox" data-mall ${sel.length?'':'checked'}> ${esc(allTxt)}</label>
    ${opts.map(([v,t])=>`<label class="mopt"><input type="checkbox" data-mv="${esc(v)}" ${sel.includes(v)?'checked':''}> ${esc(t)}</label>`).join('')}
    <div class="mfoot"><button type="button" class="btn ghost sm" data-mcancel>Huỷ</button><button type="button" class="btn sm" data-mapply>Áp dụng</button></div></div>`:''}</div>`;
}
function syncM(){const p=document.querySelector('.mpop');if(!p)return;p.querySelector('[data-mall]').checked=!MP.sel.length;p.querySelectorAll('[data-mv]').forEach(x=>x.checked=MP.sel.includes(x.dataset.mv))}
function closeM(){if(!MP)return;const k=MP.k;MP=null;renderFilters();const b=document.querySelector(`[data-mopen="${k}"]`);if(b)b.focus()}
function applyM(){if(!MP)return;const k=MP.k,p=document.querySelector('.mpop');
  const all=p?p.querySelectorAll('[data-mv]').length:0,v=p?[...p.querySelectorAll('[data-mv]:checked')].map(x=>x.dataset.mv):MP.sel;
  MP=null;const nv=!v.length||v.length===all?(k==='ch'?'all':''):v.join(',');
  if(nv===F[k]){renderFilters();return}setF(k,nv)}
function renderFilters(){
  // Bộ lọc gọn kiểu POS: ô chọn không kèm nhãn chữ (nhãn ở title / aria-label), nút biểu tượng cho so sánh và xoá lọc.
  const sel=(id,label,opts,cur)=>`<select id="${id}" class="fs" aria-label="${label}" title="${label}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(cur)===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
  // KPI R&D gộp đơn mọi dự án của sản phẩm: bỏ chọn dự án cho khỏi hiểu nhầm. KPI không lọc kênh / thị trường như file gốc.
  const rd=view==='kpi'&&kMode==='rd';
  const pSel=projOpts.length?(rd?'':sel('fProj','Dự án',[['',ME.scope==='all'?'Tất cả dự án':'Dự án của tôi'],...projOpts.map(p=>[p.id,p.name])],F.proj)):`<span class="pill p-info">${scopeLabel()}</span>`;
  const mSel=CAT.markets.length>1&&view!=='kpi'?msel('mkt','Thị trường','Mọi thị trường',CAT.markets.map(m=>[m.id,m.name])):'';
  const cSel=CAT.channels.length&&view!=='kpi'&&view!=='canhbao'?msel('ch','Kênh','Mọi kênh',[...CAT.channels.map(c=>[c.id,c.name]),['__none','Chưa xác định kênh']]):'';
  const rSel=sel('fRange','Thời gian',Object.entries(RANGES),F.range);
  const custom=F.range==='custom'?`<span class="drange"><input type="date" id="fFrom" value="${esc(F.from)}" aria-label="Từ ngày" title="Từ ngày"><span aria-hidden="true">–</span><input type="date" id="fTo" value="${esc(F.to)}" aria-label="Đến ngày" title="Đến ngày"></span>`:'';
  const cmp=`<button type="button" class="ibtn ${F.cmp?'on':''}" id="fCmpBtn" aria-pressed="${F.cmp}" aria-label="So với ${cmpLabel()}" title="${F.cmp?'Đang so với':'Bấm để so với'} ${cmpLabel()}">${Shell.icon('compare')}</button>`;
  const reset=isDefault()?'':`<button type="button" class="ibtn" id="fReset" aria-label="Xoá bộ lọc" title="Xoá bộ lọc">${Shell.icon('x')}</button>`;
  $('#filters').innerHTML=pSel+mSel+cSel+rSel+custom+cmp+reset;
  $('#toolbar').hidden=view==='caidat'||view==='chiphi';
}

// ---------- dữ liệu ----------
// ROWS: đơn gộp theo ngày × team × nhân sự × kênh × thị trường × shop × nhóm trạng thái (dash_orders). PREV: cùng cấu trúc, kỳ so sánh.
let ROWS=[],PREV=[],PRODS=null,loading=false,loadErr='',loadSeq=0;
const mapRow=r=>({day:r.day,proj:r.project_id,team:r.team_id,staff:r.staff_id,mk:r.marketer,ch:r.channel_id,mkt:r.market_id,shop:r.shop_id,g:r.st_group,n:+r.orders,rev:+r.revenue_vnd,cogs:+r.cogs_vnd||0,miss:+r.cogs_missing||0});
async function loadData(){
  const seq=++loadSeq;loading=true;loadErr='';render();
  // Chưa xác định kênh: lấy mọi kênh rồi giữ đơn chưa gán kênh (chạy được cả khi database chưa có bản lọc '__none').
  // Chọn nhiều kênh / thị trường hoặc "Chưa xác định kênh": lấy rộng rồi lọc tại đây (chạy được cả khi database chưa có bản lọc nhiều).
  const chs=fList('ch'),mks=fList('mkt');
  const base={p_project:F.proj||null,p_market:mks.length===1?mks[0]:null,p_channel:chs.length===1&&chs[0]!=='__none'?chs[0]:null};
  const [from,to]=rangeDates(),[pf,pt]=prevDates();
  const [cur,prev]=await Promise.all([sbc.rpc('dash_orders',{...base,p_from:dayISO(from),p_to:dayISO(to)}),
    F.cmp?sbc.rpc('dash_orders',{...base,p_from:dayISO(pf),p_to:dayISO(pt)}):Promise.resolve({data:[]})]);
  if(seq!==loadSeq)return;
  loading=false;
  const keep=r=>(!chs.length||chs.includes(r.ch||'__none'))&&(!mks.length||mks.includes(r.mkt));
  if(cur.error){loadErr=cur.error.message;ROWS=[]}else ROWS=cur.data.map(mapRow).filter(keep);
  PREV=prev.error?[]:(prev.data||[]).map(mapRow).filter(keep);
  PRODS=null;
  if(['sanpham','nhansu','tongquan','team','kqkd'].includes(view)||(SEE_COST&&view==='canhbao'))loadProducts();
  render();
}
async function loadProducts(){
  const [from,to]=rangeDates();
  const {data,error}=await sbc.rpc('dash_products',{p_from:dayISO(from),p_to:dayISO(to),p_project:F.proj||null,p_market:F.mkt||null,p_channel:F.ch==='all'?null:F.ch});
  PRODS=error?{err:error.message,rows:[]}:{rows:data.map(r=>({code:r.code,name:r.name,team:r.team_id,staff:r.staff_id,g:r.st_group,n:+r.orders,qty:+r.qty,rev:+r.revenue_vnd,cogs:+r.cogs_vnd||0,unit:r.unit_cost_vnd==null?null:+r.unit_cost_vnd}))};
  if(['sanpham','nhansu','canhbao','tongquan','team','kqkd'].includes(view))render();
}
// Gộp: ord = số đơn (gồm đơn huỷ, như POS; đơn đã xoá không có ở đây); rev = doanh số (không tính đơn huỷ);
// ok = đã giao; ret = hoàn; ship = đang giao; neu = chờ xử lý; cancel = đã huỷ.
function agg(list,key){
  const m=new Map();
  list.forEach(r=>{const k=key(r);let a=m.get(k);if(!a){a={k,ord:0,rev:0,ok:0,okRev:0,okCogs:0,okMiss:0,ret:0,retRev:0,ship:0,shipRev:0,neu:0,cancel:0};m.set(k,a)}
    if(r.g==='cancel'){a.cancel+=r.n;a.ord+=r.n;return}
    a.ord+=r.n;a.rev+=r.rev;
    if(r.g==='ok'){a.ok+=r.n;a.okRev+=r.rev;a.okCogs+=r.cogs||0;a.okMiss+=r.miss||0}else if(r.g==='ret'){a.ret+=r.n;a.retRev+=r.rev}else if(r.g==='ship'){a.ship+=r.n;a.shipRev+=r.rev}else a.neu+=r.n});
  return [...m.values()];
}
const ZERO={ord:0,rev:0,ok:0,okRev:0,okCogs:0,okMiss:0,ret:0,retRev:0,ship:0,shipRev:0,neu:0,cancel:0};
const tot=list=>agg(list,()=>'all')[0]||Object.assign({},ZERO);
const retRate=a=>(a.ok+a.ret)>0?a.ret/(a.ok+a.ret):NaN;
const gp=a=>a.okRev-a.okCogs;
// Tỷ lệ hoàn: dưới 25% tốt, 25–35% cần để ý, trên 35% xấu. Có chữ, không chỉ dựa vào màu.
const retPill=r=>!isFinite(r)?'<span class="muted">–</span>':r>.35?`<span class="pill p-bad" title="Cao">${P(r)}</span>`:r>.25?`<span class="pill p-warn" title="Cần để ý">${P(r)}</span>`:`<span class="pill p-good" title="Tốt">${P(r)}</span>`;
function days(){const [f,t]=rangeDates();const out=[];for(let d=new Date(f);d<t;d.setDate(d.getDate()+1))out.push(new Date(d));return out}
function prevDays(){const [f,t]=prevDates();const out=[];for(let d=new Date(f);d<t;d.setDate(d.getDate()+1))out.push(new Date(d));return out}
const dkey=d=>isoD(d);

// ---------- giải thích chỉ số ----------
const DEF={
  adsp:'Chi phí quảng cáo (USD × tỷ giá tháng, nhập ở màn Chi phí ads) ÷ doanh số đơn tạo trong kỳ, bỏ đơn huỷ. Không lọc theo kênh.',
  rev:'Tổng tiền các đơn đặt trong khoảng ngày (sau giảm giá, quy ra VNĐ), không tính đơn huỷ / đã xoá.',
  ord:'Số đơn đặt trong khoảng ngày, không tính đơn huỷ / đã xoá.',
  ret:'Đơn hoàn ÷ (đơn đã giao + đơn hoàn). Đơn đang giao chưa tính vì chưa biết kết quả.',
  gp:'Tiền các đơn đã giao trừ giá vốn (giá nhập gần nhất tính đến ngày đặt). Chưa trừ chi phí ads, vận chuyển.',
  ok:'Tiền các đơn khách đã nhận hàng (POS báo đã giao / đã thu tiền).',
  aov:'Doanh số ÷ số đơn.',
  ship:'Đơn đã gửi cho đơn vị vận chuyển, chưa có kết quả giao.',
  neu:'Đơn mới, đã xác nhận, đang đóng gói… chưa gửi đi.',
  target:'Target doanh số tháng của các team (khai báo ở Quản trị → Danh mục → Team).',
};
// Nút (?) với chữ giải thích tuỳ ý.
const tipT=t=>`<span class="tip" tabindex="0" role="note" aria-label="${esc(t)}" data-tip="${esc(t)}">?</span>`;
const tip=k=>`<span class="tip" tabindex="0" role="note" aria-label="${esc(DEF[k]||k)}" data-tip="${esc(DEF[k]||k)}">?</span>`;
// Mức thay đổi so với kỳ trước: mũi tên + chữ + màu theo hướng tốt / xấu của chỉ số.
function delta(cur,prev,o={}){
  if(!F.cmp)return '';
  if(!isFinite(cur)||!isFinite(prev))return `<span class="delta flat">– so với ${cmpLabel()}</span>`;
  let d,txt;
  if(o.pp){d=cur-prev;txt=(Math.abs(d)*100).toFixed(1).replace('.',',')+' điểm %'}
  else{if(!prev)return cur?`<span class="delta flat">mới so với ${cmpLabel()}</span>`:'';d=(cur-prev)/Math.abs(prev);txt=(Math.abs(d)*100).toFixed(Math.abs(d)<.1?1:0).replace('.',',')+'%'}
  if(Math.abs(d)<.0005)return `<span class="delta flat">= ${cmpLabel()}</span>`;
  const up=d>0,good=o.lowerBetter?!up:up;
  return `<span class="delta ${good?'good':'bad'}" title="${good?'Tốt hơn':'Kém hơn'} ${cmpLabel()}"><span>${up?'▲':'▼'} ${txt}</span>${o.short?'':` <span class="muted">so với ${cmpLabel()}</span>`}</span>`;
}

// ---------- biểu đồ ----------
// Chuỗi theo ngày của một chỉ số, khớp đúng các ngày của khoảng đang xem.
function series(list,ds,fn){const by=new Map(agg(list,r=>r.day).map(a=>[a.k,a]));return ds.map(d=>{const a=by.get(dkey(d));return a?fn(a):0})}
const METRICS={rev:['Doanh số',a=>a.rev,M],ord:['Số đơn',a=>a.ord,N],ret:['Tỷ lệ hoàn',a=>{const r=retRate(a);return isFinite(r)?r:0},v=>P(v)]};
let chartMetric=store.get('cmetric','rev');if(!METRICS[chartMetric])chartMetric='rev';
function trendChart(list,prevList,h=240,W=720){
  const ds=days();if(ds.length<2)return `<div class="muted" style="padding:24px 0;text-align:center">Chọn khoảng từ 2 ngày trở lên để xem xu hướng theo ngày.</div>`;
  const [lab,fn,fmt]=METRICS[chartMetric];
  const cur=series(list,ds,fn),prev=F.cmp?series(prevList,prevDays(),fn).slice(0,ds.length):[];
  const H=h,L=chartMetric==='rev'?96:56,Rr=12,T=14,B=28,iw=W-L-Rr,ih=H-T-B,bw=iw/ds.length;
  const mx=Math.max(chartMetric==='ret'?.05:1,...cur,...prev);
  const step=chartMetric==='ret'?[.05,.1,.2,.25].find(x=>mx/x<=5)||.25:(()=>{const s=Math.pow(10,Math.floor(Math.log10(mx)));return [1,2,2.5,5,10].map(x=>x*s).find(x=>mx/x<=5)||s*10})();
  const top=Math.ceil(mx/step)*step,y=v=>T+ih-(v/top)*ih;
  const axis=v=>chartMetric==='ret'?Math.round(v*100)+'%':N(v);
  let g='';
  for(let v=0;v<=top+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${axis(v)}</text>`;
  const every=Math.ceil(ds.length/8);
  ds.forEach((d,i)=>{const x=L+i*bw,v=cur[i];
    g+=`<rect x="${x+bw*.14}" y="${y(v)}" width="${Math.max(1,bw*.72)}" height="${Math.max(0,T+ih-y(v))}" rx="2" fill="var(--accent)" opacity="${i===ds.length-1?'.9':'.55'}"><title>${fmtD(d)}: ${fmt(v)}${prev.length?' · kỳ trước '+fmt(prev[i]||0):''}</title></rect>`;
    if(i%every===0||i===ds.length-1)g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtD(d)}</text>`});
  if(prev.length>1)g+=`<polyline points="${prev.map((v,i)=>[L+i*bw+bw/2,y(v)].join(',')).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${lab} theo ngày">${g}</svg>
  <div class="chart-legend"><span><i class="sw" style="background:var(--accent)"></i>${lab} kỳ này</span>${prev.length>1?`<span><i class="sw dash"></i>${cmpLabel()}</span>`:''}</div>`;
}
function spark(vals,color){if(vals.length<2)return '';const W=120,H=30,mx=Math.max(1e-9,...vals);const pts=vals.map((x,i)=>[(i/(vals.length-1)*W).toFixed(1),(H-2-(x/mx)*(H-6)).toFixed(1)]);
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${H} ${pts.map(p=>p.join(',')).join(' ')} ${W},${H}" fill="${color||'var(--accent)'}" opacity=".12"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color||'var(--accent)'}" stroke-width="1.6"/></svg>`}

// ---------- ô chỉ số ----------
// 4 chỉ số chính, mỗi ô: giá trị, so với kỳ trước, xu hướng theo ngày. Dưới là dải số phụ.
// ads: {cost, rev, cap, loading} từ bảng theo dõi (chi phí ads ÷ doanh số trong kỳ); null thì không hiện ô này.
function kpiCards(list,prevList,ads){
  const a=tot(list),p=tot(prevList),ds=days();
  const four=[
    ['rev','Doanh số',M(a.rev),delta(a.rev,p.rev),series(list,ds,x=>x.rev)],
    ['ord','Số đơn',N(a.ord),delta(a.ord,p.ord),series(list,ds,x=>x.ord)],
    ['ret','Tỷ lệ hoàn',P(retRate(a)),delta(retRate(a),retRate(p),{pp:1,lowerBetter:1}),null,`${N(a.ret)} đơn hoàn · ${N(a.ok)} đã giao`],
    SEE_COST?['gp','Lợi nhuận gộp',M(gp(a)),delta(gp(a),gp(p)),null,a.okRev?`${P(gp(a)/a.okRev)} trên tiền đã giao`:'Chưa có đơn đã giao']
           :['ok','Tiền đã giao',M(a.okRev),delta(a.okRev,p.okRev),null,`${N(a.ok)} đơn đã giao`],
  ];
  if(ads){const v=ads.rev?ads.cost/ads.rev:NaN,over=ads.cap&&v*100>ads.cap;
    four.splice(3,0,['adsp','% chi phí ads',ads.loading?'<span class="skel" style="display:inline-block;height:22px;width:70px"></span>':`<span class="${over?'neg':''}">${P(v)}</span>`,
      ads.loading||!ads.cap?'':`<span class="delta ${over?'bad':'good'}">${over?'▲ vượt':'✓ trong'} trần ${PF(ads.cap)}%</span>`,null,ads.loading?'':`chi phí ${M(ads.cost)} / doanh số ${M(ads.rev)}`])}
  // Giá trị TB / đơn: chỉ chia cho đơn không huỷ (đơn huỷ không có doanh số).
  const live=x=>x.ord-x.cancel,aov=live(a)?a.rev/live(a):NaN,paov=live(p)?p.rev/live(p):NaN;
  return `<div class="kpis ${four.length>4?'kpis5':'kpis4'}">${four.map(([k,l,v,d,sp,sub],i)=>`<div class="kpi m-${k}${i===0?' primary':''}"><div class="l">${l} ${tip(k)}</div><div class="v">${v}</div><div class="n">${d||''}${sub?`<div>${sub}</div>`:''}</div>${sp&&ds.length>1?spark(sp):''}</div>`).join('')}</div>
  <div class="statstrip ist">
    <div>${ico('coins','i-green')}<div><span class="l">Giá trị TB / đơn ${tip('aov')}</span><b>${isFinite(aov)?N(aov)+' ₫':'–'}</b>${delta(aov,paov,{short:1})}</div></div>
    <div>${ico('receipt','i-blue')}<div><span class="l">Đang giao ${tip('ship')}</span><b>${N(a.ship)}</b><span class="muted">${M(a.shipRev)}</span></div></div>
    <div>${ico('inbox','i-amber')}<div><span class="l">Chờ xử lý ${tip('neu')}</span><b>${N(a.neu)}</b></div></div>
    <div>${ico('x','i-red')}<div><span class="l">Đã huỷ</span><b>${N(a.cancel)}</b><span class="muted">${P(a.cancel/(a.ord||NaN))} số đơn</span></div></div>
  </div>`;
}
// Ô tròn có biểu tượng cho dải số phụ (kiểu MISA): màu theo ý nghĩa, chỉ để trang trí nên ẩn với trình đọc màn hình.
const ico=(name,cls)=>`<span class="ico ${cls}" aria-hidden="true">${Shell.icon(name)}</span>`;
// Tiến độ target tháng: đã đạt, đã qua bao nhiêu thời gian, dự kiến cuối tháng.
function targetBlock(list,target){
  if(!target||F.range!=='month')return '';
  const a=tot(list),t=new Date(),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  const elapsed=Math.min(1,(t.getDate()-1+t.getHours()/24)/dim),done=a.rev/target,proj=elapsed>0?a.rev/elapsed:0,pr=proj/target;
  const st=pr>=1?['p-good','Đúng tiến độ']:pr>=.85?['p-warn','Hơi chậm']:['p-bad','Chậm tiến độ'];
  return `<div class="card target"><div class="cardhead"><div><h2>Tiến độ target tháng ${tip('target')}</h2><p class="hint keep">Đã đạt <b>${M(a.rev)}</b> / ${M(target)} · đã qua ${P(elapsed,0)} thời gian của tháng</p></div><span class="pill ${st[0]}">${st[1]}</span></div>
    <div class="tbar" role="img" aria-label="Đạt ${P(done)} target, đã qua ${P(elapsed,0)} tháng"><i style="width:${Math.min(100,done*100).toFixed(1)}%"></i><b style="left:${(elapsed*100).toFixed(1)}%" title="Hôm nay"></b></div>
    <div class="tlegend"><span><b>${P(done)}</b> target đã đạt</span><span>Dự kiến cuối tháng: <b>${M(proj)}</b> (${P(pr,0)} target)</span></div></div>`;
}

// ---------- bảng: sắp xếp, xuất Excel ----------
// cols: [{k, label, l (căn trái), fmt(row) → html, val(row) → số/chuỗi để sắp xếp và xuất, tip}]
const SORT={},TBL={};
// ---------- phân trang dùng chung ----------
// PG[key] = {page, per}. Số dòng mỗi trang nhớ trên máy theo từng bảng.
const PG={},PER_OPTS=[10,25,50,100,200,500,1000];
function pgState(key,defPer){if(!PG[key]){const v=+store.get('per_'+key,'');PG[key]={page:0,per:PER_OPTS.includes(v)?v:(defPer||25)}}return PG[key]}
// Dải số trang gọn: 1 … 4 5 [6] 7 8 … 120
function pgNums(p,n){const out=[],add=x=>{if(!out.includes(x))out.push(x)};add(0);for(let i=p-2;i<=p+2;i++)if(i>0&&i<n-1)add(i);if(n>1)add(n-1);
  const r=[];out.sort((a,b)=>a-b).forEach((x,i)=>{if(i&&x-out[i-1]>1)r.push('…');r.push(x)});return r}
function pager(key,total){
  const st=pgState(key),n=Math.max(1,Math.ceil(total/st.per)),p=Math.min(st.page,n-1),a=total?p*st.per+1:0,b=Math.min(total,(p+1)*st.per);
  const btn=(to,label,aria,dis,cur)=>`<button type="button" data-pgk="${key}" data-pgto="${to}" ${dis?'disabled':''} ${aria?`aria-label="${aria}" title="${aria}"`:''} ${cur?'aria-current="page" class="on"':''}>${label}</button>`;
  return `<nav class="pager" aria-label="Phân trang">
    <span class="pg-info">Hiển thị <b>${N(a)}–${N(b)}</b> / ${N(total)}</span>
    <label class="pg-per">Mỗi trang <select data-pgper="${key}" aria-label="Số dòng mỗi trang">${PER_OPTS.map(v=>`<option value="${v}" ${v===st.per?'selected':''}>${v}</option>`).join('')}</select></label>
    ${n>1?`<div class="pg-nav">${btn(0,'«','Trang đầu',p===0)}${btn(p-1,'‹','Trang trước',p===0)}${pgNums(p,n).map(x=>x==='…'?'<span class="pg-gap" aria-hidden="true">…</span>':btn(x,N(x+1),'Trang '+(x+1),false,x===p)).join('')}${btn(p+1,'›','Trang sau',p>=n-1)}${btn(n-1,'»','Trang cuối',p>=n-1)}</div>
    <label class="pg-go">Đến trang <input type="number" min="1" max="${n}" inputmode="numeric" data-pggo="${key}" placeholder="${p+1}" aria-label="Nhập số trang, từ 1 đến ${n}"> / ${N(n)}</label>`:''}
  </nav>`;
}
// Cắt dòng cho trang hiện tại (bảng có sẵn hết dữ liệu trong máy).
function pgSlice(key,rows,defPer){const st=pgState(key,defPer),n=Math.max(1,Math.ceil(rows.length/st.per));if(st.page>n-1)st.page=n-1;return rows.slice(st.page*st.per,(st.page+1)*st.per)}
const pgReset=()=>{Object.values(PG).forEach(x=>x.page=0)};
// Ô "Đến trang": nhận số 1…n, ngoài khoảng thì đưa về trang gần nhất.
function pgGo(el){const k=el.dataset.pggo,n=+el.max||1,v=parseInt(el.value,10);if(!isFinite(v))return;pgState(k).page=Math.min(n,Math.max(1,v))-1;render();const i=document.querySelector(`[data-pggo="${k}"]`);if(i)i.focus()}
function dataTable(id,cols,rows,o={}){
  const s=SORT[id]||(SORT[id]={k:o.sortKey||cols[1].k,dir:-1});
  const c=cols.find(x=>x.k===s.k)||cols[1];
  const sorted=rows.slice().sort((a,b)=>{const x=c.val(a),y=c.val(b);return (typeof x==='string'?String(x).localeCompare(String(y),'vi'):(isFinite(x)?x:-Infinity)-(isFinite(y)?y:-Infinity))*s.dir});
  TBL[id]={cols,xcols:o.xcols||[],rows:sorted,name:o.name||id};
  const th=x=>`<th class="${x.l?'l ':''}sort" data-sortt="${id}:${x.k}" aria-sort="${s.k===x.k?(s.dir>0?'ascending':'descending'):'none'}" title="Bấm để sắp xếp">${x.label}${x.tip?' '+tip(x.tip):''}${s.k===x.k?`<span class="sarr">${s.dir>0?'↑':'↓'}</span>`:''}</th>`;
  const paged=sorted.length>25,shown=paged?pgSlice(id,sorted,50):sorted;
  return `<div class="tw"><table id="${id}" class="sthead"><thead><tr>${cols.map(th).join('')}</tr></thead><tbody>
  ${shown.map(r=>`<tr class="${o.click&&o.click(r)?'click':''}" ${o.click&&o.click(r)?`data-go="${esc(o.click(r))}" tabindex="0"`:''}>${cols.map(x=>`<td class="${x.l?'l':''}">${x.fmt(r)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}">${Shell.empty('inbox','Không có dữ liệu','Thử đổi bộ lọc hoặc khoảng ngày.')}</td></tr>`}
  </tbody>${o.foot&&sorted.length>1?`<tfoot><tr>${cols.map(x=>`<td class="${x.l?'l':''}">${o.foot[x.k]??''}</td>`).join('')}</tr></tfoot>`:''}</table></div>${paged?pager(id,sorted.length):''}`;
}
const exportBtn=id=>`<button class="btn ghost sm" type="button" data-export="${id}" title="Tải bảng về dạng CSV (mở bằng Excel)">Xuất Excel</button>`;
function exportTable(id){
  if(id==='tPL'){exportDom(id);return}
  const t=TBL[id];if(!t)return;
  const cell=v=>{if(typeof v==='number'&&!isFinite(v))return '';const s=String(v??'').replace(/<[^>]+>/g,'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const cs=t.xcols.length?[t.cols[0]].concat(t.xcols):t.cols;
  const lines=[cs.map(c=>cell(c.label.replace(/<[^>]+>/g,''))).join(',')].concat(t.rows.map(r=>cs.map(c=>cell(c.val(r))).join(',')));
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${t.name} ${rangeLabel().replace(/[\/ –]+/g,'-')}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportDom(id){
  const tb=document.getElementById(id);if(!tb)return;const hd=document.getElementById(id+'h');
  const cell=s=>{s=String(s).trim().replace(/\s+/g,' ');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[...(hd?hd.querySelectorAll('tr'):[]),...tb.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>cell(td.innerText)).join(','));
  const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Ket qua kinh doanh ${rangeLabel().replace(/[\/ –]+/g,'-')}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
// Bảng xếp hạng theo nhóm (team / nhân sự / kênh): cột ít, có so với kỳ trước, tiến độ target nếu có.
function rankRows(list,prevList,keyFn){const pm=new Map(agg(prevList,keyFn).map(a=>[a.k,a]));return agg(list,keyFn).map(a=>Object.assign(a,{p:pm.get(a.k)||ZERO}))}
function rankCols(label,nameFn,o={}){
  const cols=[{k:'name',label,l:1,fmt:r=>nameFn(r.k,r),val:r=>String(nameFn(r.k,r)).replace(/<[^>]+>/g,'')},
    {k:'rev',label:'Doanh số',tip:'rev',fmt:r=>`<div class="num2"><b>${M(r.rev)}</b>${delta(r.rev,r.p.rev,{short:1})}</div>`,val:r=>r.rev},
    {k:'ord',label:'Số đơn',fmt:r=>N(r.ord),val:r=>r.ord},
    {k:'ret',label:'Tỷ lệ hoàn',tip:'ret',fmt:r=>retPill(retRate(r)),val:r=>retRate(r)}];
  if(SEE_COST&&o.gp)cols.push({k:'gp',label:'Lợi nhuận gộp',tip:'gp',fmt:r=>r.ok?M(gp(r)):'<span class="muted">–</span>',val:r=>gp(r)});
  if(o.target)cols.push({k:'tg',label:'Tiến độ target',fmt:r=>{const t=o.target(r.k);return t?`<div class="minibar" title="${P(r.rev/t)} target ${M(t)}"><i style="width:${Math.min(100,r.rev/t*100).toFixed(0)}%"></i><span>${P(r.rev/t,0)}</span></div>`:'<span class="muted">–</span>'},val:r=>{const t=o.target(r.k);return t?r.rev/t:NaN}});
  if(o.extra)cols.push(...o.extra);
  return cols;
}
const totFoot=(list)=>{const a=tot(list);return {name:'<b>Tổng</b>',rev:`<b>${M(a.rev)}</b>`,ord:N(a.ord),ret:retPill(retRate(a)),gp:SEE_COST?M(gp(a)):''}};
function legend(list,keyFn,nameFn,colorFn){
  const a=tot(list),g=agg(list,keyFn).sort((x,y)=>y.rev-x.rev);
  return `${colorFn?`<div class="mix">${g.map(c=>`<span style="width:${a.rev?c.rev/a.rev*100:0}%;background:${esc(colorFn(c.k))}" title="${esc(String(nameFn(c.k)).replace(/<[^>]+>/g,''))}: ${P(a.rev?c.rev/a.rev:0)}"></span>`).join('')}</div>`:''}
  <div class="legend">${g.map(c=>`<div class="row"><span class="k">${nameFn(c.k)}</span><span>${M(c.rev)}</span><span class="s">${P(a.rev?c.rev/a.rev:0,0)}</span></div>`).join('')||'<span class="muted">–</span>'}</div>`;
}
const crumbs=items=>`<div class="crumbs" role="navigation" aria-label="Vị trí">${items.map(([l,go],i)=>i<items.length-1?`<button class="lnk" data-go="${esc(go)}">${esc(l)}</button><span aria-hidden="true">›</span>`:`<span>${esc(l)}</span>`).join('')}</div>`;
function empty(){
  if(loadErr)return `<div class="card">${Shell.empty('alert','Không tải được số liệu',esc(loadErr)+'<br>Kiểm tra đã chạy đủ các file SQL trên Supabase chưa.')}</div>`;
  if(loading&&!ROWS.length)return skeleton();
  const why=ME.scope==='self'&&!ME.staff_id?'Tài khoản này chưa được liên kết với nhân sự nào. Nhờ admin liên kết ở Quản trị → Tài khoản.'
    :ME.scope==='all'?'Thử chọn khoảng ngày dài hơn, hoặc kiểm tra Quản trị → Kết nối POS đã có shop, API key và đã đồng bộ chưa.'
    :'Thử chọn khoảng ngày dài hơn. Nếu vẫn trống, có thể marketer chưa được khai báo vào team (Quản trị → Chưa khai báo).';
  const acts=(F.range==='today'||F.range==='yesterday'?'<button class="btn ghost sm" data-range="month">Xem cả tháng này</button>':'')+(ME.role==='admin'?'<a class="btn ghost sm" href="admin.html#pos">Kết nối POS</a><a class="btn ghost sm" href="admin.html#chuakhaibao">Chưa khai báo</a>':'');
  return `<div class="card">${Shell.empty('inbox','Chưa có đơn trong khoảng này',why,acts)}</div>`;
}
// Khung chờ khi đang tải lần đầu.

// Bảng sản phẩm. kpRows: số theo sản phẩm (KP) cùng phạm vi để tính % chi phí ads, % LNG, % Net.
// o.top: chỉ hiện N sản phẩm doanh số cao nhất, ít cột (Tổng quan, Team).
// Gộp số theo sản phẩm (mã POS) + số từ KPI (chi phí ads, LNG, Net) + nhóm sản phẩm.
function prodAgg(rows,kpRows){
  const m=new Map();
  rows.forEach(r=>{let a=m.get(r.code);if(!a){a={code:r.code,name:r.name,ord:0,qty:0,rev:0,ok:0,okRev:0,okCogs:0,ret:0,ship:0,unit:null};m.set(r.code,a)}
    if(r.g==='cancel')return;a.ord+=r.n;a.qty+=r.qty;a.rev+=r.rev;if(r.unit!=null)a.unit=Math.max(a.unit||0,r.unit);if(r.g==='ok'){a.ok+=r.n;a.okRev+=r.rev;a.okCogs+=r.cogs}else if(r.g==='ret')a.ret+=r.n;else if(r.g==='ship')a.ship+=r.n;if(r.name)a.name=r.name});
  const g=[...m.values()].filter(a=>a.ord);
  const pm=kpRows?kpProducts(kpRows):new Map(),grp=new Map();
  (kpRows||[]).forEach(r=>{if(r.grp!=null&&!grp.has(r.pk))grp.set(r.pk,r.grp)});
  g.forEach(a=>{const k=pm.get(pkey(a.name));a.adsP=k&&k.sent?k.ads/k.sent:NaN;a.gp3=k?k.gp3:NaN;a.lngP=k&&k.ok?k.gp3/k.ok:NaN;a.netP=k&&k.ok?k.net/k.ok:NaN;a.grp=grp.get(pkey(a.name))});
  return g;
}
const adsCap=()=>{const c=[...new Set(CAT.teams.map(t=>+t.ads_pct_max||0).filter(Boolean))];return c.length===1?c[0]:0};
function prodTable(rows,withSearch,kpRows,o={}){
  let g=prodAgg(rows,kpRows);
  if(withSearch&&pQ){const q=pQ.toLowerCase();g=g.filter(a=>(a.code+' '+(a.name||'')).toLowerCase().includes(q))}
  const nz=v=>isFinite(v)?v:-Infinity;
  const sf={rev:a=>-a.rev,ord:a=>-a.ord,qty:a=>-a.qty,rr:a=>-(retRate(a)||0),ads:a=>-nz(a.adsP),lng:a=>-nz(a.lngP),net:a=>-nz(a.netP),gp:a=>-nz(a.gp3)};
  const sk=o.top?'rev':pSort;g.sort((x,y)=>(sf[sk]||sf.rev)(x)-(sf[sk]||sf.rev)(y));
  const total=g.length,maxRev=Math.max(1,...g.map(a=>a.rev));if(o.top)g=g.slice(0,o.top);
  const th=(k,l,tk,cls)=>withSearch?`<th class="sort${cls?' '+cls:''}" data-sort="${k}">${l}${tk?' '+tip(tk):''}${pSort===k?' ↓':''}</th>`:`<th${cls?` class="${cls}"`:''}>${l}${tk?' '+tip(tk):''}</th>`;
  const kpLoading=kpRows&&KP.loading&&!KP.rows.length,skel='<span class="skel" style="display:inline-block;width:40px;height:10px"></span>',dash='<span class="muted">–</span>';
  const cap=adsCap();
  // Chỉ tô màu chỗ cần chú ý: vượt trần chi phí ads, lãi mỏng, lỗ.
  const adsC=v=>kpLoading?skel:!isFinite(v)?dash:cap&&v*100>cap?`<span class="pill p-bad" title="Vượt trần ${PF(cap)}%">${P(v)} ▲</span>`:P(v);
  const grade=v=>kpLoading?skel:!isFinite(v)?dash:v<0?`<span class="pill p-bad" title="Lỗ">▼ ${P(v)}</span>`:v<.1?`<span class="pill p-warn" title="Lãi mỏng, dưới 10%">${P(v)}</span>`:`<span class="pill p-good" title="Lãi tốt, từ 10%">${P(v)}</span>`;
  const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
  const name=a=>`<div class="pcell"><span class="pav${a.grp?' g'+a.grp:''}" aria-hidden="true">${esc(ini(a.name))}</span><div><div class="pn">${esc(a.name||'')}</div><div class="sub2"><span class="mono">${esc(a.code)}</span>${a.grp?` · <span title="${esc(GNAME(a.grp))}">Nhóm ${a.grp}</span>`:''}${stockTag(a.code)}</div></div></div>`;
  const rev=a=>`<span class="vbar"><b>${M(a.rev)}</b><i style="width:${(a.rev/maxRev*100).toFixed(1)}%"></i></span>`;
  const lng=a=>kpLoading?skel:isFinite(a.gp3)?`<b class="${a.gp3<0?'neg':''}">${M(a.gp3)}</b>`:dash;
  if(o.top)return `<div class="tw"><table class="sthead ptab"><thead><tr><th class="l">Sản phẩm</th><th>Doanh số</th><th>Số đơn</th><th>% hoàn ${tip('ret')}</th><th>% chi phí ads ${tip('p_ads')}</th>${SEE_COST?`<th>% LNG ${tip('p_lng')}</th>`:''}</tr></thead><tbody>
    ${g.map((a,i)=>`<tr class="${SEE_COST&&a.gp3<0?'loss':''}"><td class="l"><div style="display:flex;gap:10px;align-items:center"><span class="rank r${i+1}">${i+1}</span>${name(a)}</div></td><td>${rev(a)}</td><td>${N(a.ord)}</td><td>${retPill(retRate(a))}</td><td>${adsC(a.adsP)}</td>${SEE_COST?`<td>${grade(a.lngP)}</td>`:''}</tr>`).join('')||`<tr><td colspan="6">${Shell.empty('box','Chưa có sản phẩm bán ra','Không có đơn trong khoảng đang lọc.')}</td></tr>`}
    </tbody></table></div>${total>g.length&&ALLOWED.includes('sanpham')?`<div style="margin-top:10px"><button class="lnk" data-go="sanpham:">Xem tất cả ${N(total)} sản phẩm</button></div>`:''}`;
  // Giá vốn, LNG, % LNG, % Net: chỉ người xem được chi phí (SEE_COST).
  const pk=o.pk||'prod',paged=g.length>25,rowsAll=g.length;if(paged)g=pgSlice(pk,g,50);
  return `<div class="tw"><table class="sthead ptab"><thead><tr><th class="l">Sản phẩm</th>${th('rev','Doanh số')}${th('ord','Số đơn')}${th('qty','Số lượng','','sec')}<th class="sec">Đã giao</th>${th('rr','% hoàn')}${th('ads','% CP ads','p_ads')}${SEE_COST?`<th class="sec">Giá vốn/SP</th>${th('gp','LNG')}${th('lng','% LNG','p_lng')}${th('net','% Net','p_net')}`:''}</tr></thead><tbody>
  ${g.map(a=>`<tr class="${SEE_COST&&a.gp3<0?'loss':''}"><td class="l">${name(a)}</td><td>${rev(a)}</td><td>${N(a.ord)}</td><td class="sec">${N(a.qty)}</td><td class="sec">${N(a.ok)}</td><td>${retPill(retRate(a))}</td><td>${adsC(a.adsP)}</td>${SEE_COST?`<td class="sec">${a.unit!=null?N(a.unit):'<span class="pill p-bad">Chưa có</span>'}</td><td class="lng">${lng(a)}</td><td>${grade(a.lngP)}</td><td>${grade(a.netP)}</td>`:''}</tr>`).join('')||`<tr><td colspan="11">${Shell.empty('box','Không có sản phẩm khớp','Thử từ khoá khác hoặc khoảng ngày dài hơn.')}</td></tr>`}
  </tbody></table></div>${paged?pager(pk,rowsAll):''}`;
}
// Dải tóm tắt trên bảng sản phẩm: đọc lướt là biết bao nhiêu mã, mã nào chạy nhất, bao nhiêu mã lỗ, mã nào hoàn nhiều.
function prodStrip(rows,kpRows){
  const g=prodAgg(rows,kpRows);if(!g.length)return '';
  const kpLoading=KP.loading&&!KP.rows.length;
  const top=g.reduce((x,a)=>a.rev>x.rev?a:x,g[0]),sumRev=g.reduce((t,a)=>t+a.rev,0);
  const rr=g.filter(a=>a.ok+a.ret>=10).sort((x,y)=>retRate(y)-retRate(x))[0];
  const cells=[['Sản phẩm có đơn',N(g.length),`${N(g.reduce((t,a)=>t+a.ord,0))} đơn`,'box','i-orange'],
    ['Bán chạy nhất',esc(top.name||top.code),`${M(top.rev)} · ${P(top.rev/(sumRev||1))} doanh số`,'chart','i-green']];
  if(SEE_COST){const k=g.filter(a=>isFinite(a.gp3)),lo=k.filter(a=>a.gp3<0).length;
    cells.push(['Lãi / lỗ (LNG)',kpLoading?'…':`${N(k.length-lo)} lãi · <span class="${lo?'neg':''}">${N(lo)} lỗ</span>`,lo?'Mã lỗ có vạch đỏ ở đầu dòng':'Không có mã nào lỗ','coins','i-cyan'])}
  else{const cap=adsCap(),hi=g.filter(a=>isFinite(a.adsP)).sort((x,y)=>y.adsP-x.adsP)[0];
    cells.push(['% chi phí ads cao nhất',hi?esc(hi.name||hi.code):'–',hi?`${P(hi.adsP)}${cap?` · trần ${PF(cap)}%`:''}`:'','coins','i-purple'])}
  cells.push(['Hoàn cao nhất',rr?esc(rr.name||rr.code):'–',rr?`${P(retRate(rr))} đơn hoàn`:'Chưa đủ đơn giao / hoàn','alert','i-red']);
  return `<div class="statstrip pstrip ist">${cells.map(([l,v,sub,ic,c])=>`<div>${ico(ic,c)}<div><span class="l">${l}</span><b>${v}</b><span class="muted">${sub}</span></div></div>`).join('')}</div>`;
}

function runJT(file){
  const out=$('#jtOut');if(!out)return;out.innerHTML='<p class="muted">Đang đọc file…</p>';
  const f=FFMS.find(x=>x.id===($('#jtFfm')||{}).value)||null;
  if(typeof XLSX==='undefined'){out.innerHTML='<p class="neg">Không tải được thư viện đọc Excel. Thử lưu file thành .csv rồi tải lại.</p>';return}
  const fr=new FileReader();
  fr.onload=e=>{try{
    const isCsv=/\.csv$/i.test(file.name);const wb=isCsv?XLSX.read(new TextDecoder('utf-8').decode(e.target.result).replace(/^﻿/,''),{type:'string'}):XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];const data=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!data.length){out.innerHTML='<p class="neg">File không có dòng dữ liệu nào.</p>';return}
    const keys=Object.keys(data[0]);const nk=k=>k.normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();const find=(...c)=>keys.find(k=>c.some(x=>nk(k).includes(x.normalize('NFC'))));
    const kWb=find('waybill','mã vận đơn','ma van don'),kCod=find('cod'),kSt=find('order status','trạng thái','status'),kPr=find('tên sản phẩm','product','item');
    if(!kCod||!kSt){out.innerHTML=`<p class="neg">Không tìm thấy cột COD hoặc Order Status. Các cột trong file: ${esc(keys.join(', '))}.</p>`;return}
    const num=v=>{if(typeof v==='number')return v;const s=String(v).replace(/[^\d,.-]/g,'');return parseFloat(s.includes(',')&&!s.includes('.')?s.replace(',','.'):s.replace(/,/g,''))||0};
    const by={};const prod={};const seen=new Set();let dup=0;
    data.forEach(r=>{if(kWb){const w=String(r[kWb]).trim();if(w){if(seen.has(w)){dup++;return}seen.add(w)}}
      const st=String(r[kSt]).trim()||'(trống)';const cod=num(r[kCod]);
      (by[st]=by[st]||{n:0,cod:0});by[st].n++;by[st].cod+=cod;
      if(kPr){const p=String(r[kPr]).trim()||'(không tên)';(prod[p]=prod[p]||{n:0,del:0,ret:0});prod[p].n++;if(/deliver|giao|signed/i.test(st))prod[p].del++;if(/return|hoàn/i.test(st))prod[p].ret++}});
    const total=Object.values(by).reduce((s,x)=>s+x.n,0);
    const del=Object.entries(by).filter(([k])=>/deliver|giao|signed/i.test(k)).reduce((s,[,x])=>({n:s.n+x.n,cod:s.cod+x.cod}),{n:0,cod:0});
    const ret=Object.entries(by).filter(([k])=>/return|hoàn/i.test(k)).reduce((s,[,x])=>s+x.n,0);
    const svc=f?del.cod*(+f.feePct||0)/100:0, ship=f?total*(+f.shipPhp||0):0, net=del.cod-svc-ship;
    const tp=Object.entries(prod).sort((a,b)=>b[1].n-a[1].n).slice(0,15);
    out.innerHTML=`<div class="kpis"><div class="kpi"><div class="l">Vận đơn</div><div class="v">${N(total)}</div><div class="n">${dup?N(dup)+' dòng trùng mã đã bỏ':'không có dòng trùng'}</div></div>
      <div class="kpi"><div class="l">Giao thành công</div><div class="v">${N(del.n)}</div><div class="n">${P(del.n/total)}</div></div>
      <div class="kpi"><div class="l">Hoàn</div><div class="v">${N(ret)}</div><div class="n">${P(ret/((del.n+ret)||1))} trên đơn đã xong</div></div>
      <div class="kpi"><div class="l">COD đã giao</div><div class="v">${N(del.cod)} ₱</div><div class="n">≈ ${M(del.cod*PHP)}</div></div>
      ${f?`<div class="kpi"><div class="l">Tiền về dự kiến · ${esc(f.name)}</div><div class="v">${N(net)} ₱</div><div class="n">trừ phí ${PF(f.feePct)}% và cước ${PF(f.shipPhp)} ₱/đơn · ≈ ${M(net*PHP)}</div></div>`:''}</div>
      <div class="grid2"><div class="card" style="margin:0"><h2>Theo trạng thái</h2><div class="tw"><table><thead><tr><th class="l">Order Status</th><th>Số đơn</th><th>COD ₱</th></tr></thead><tbody>${Object.entries(by).sort((a,b)=>b[1].n-a[1].n).map(([k,x])=>`<tr><td class="l">${esc(k)}</td><td>${N(x.n)}</td><td>${N(x.cod)}</td></tr>`).join('')}</tbody></table></div></div>
      ${kPr?`<div class="card" style="margin:0"><h2>Tỷ lệ hoàn theo sản phẩm</h2><p class="hint">15 sản phẩm nhiều đơn nhất.</p><div class="tw"><table><thead><tr><th class="l">Sản phẩm</th><th>Đơn</th><th>% hoàn</th></tr></thead><tbody>${tp.map(([k,x])=>{const r=x.ret/((x.del+x.ret)||1);return `<tr><td class="l" style="white-space:normal">${esc(k)}</td><td>${N(x.n)}</td><td>${r>.3?`<span class="pill p-warn">${P(r)}</span>`:P(r)}</td></tr>`}).join('')}</tbody></table></div></div>`:''}</div>`;
  }catch(err){out.innerHTML=`<p class="neg">Không đọc được file: ${esc(err.message)}. Kiểm tra file là .xlsx hoặc .csv.</p>`}};
  fr.onerror=()=>{out.innerHTML='<p class="neg">Không đọc được file. Thử chọn lại.</p>'};
  fr.readAsArrayBuffer(file);
}

async function saveKSet(){
  const row={month:K.month,updated_at:new Date().toISOString()};
  for(const [k,l] of KFIELDS){const v=parseFloat(val('ks_'+k));if(!(v>=0)){const m=$('#kSetMsg');m.className='fmsg neg';m.textContent=`“${l}” phải là số từ 0 trở lên.`;$('#ks_'+k).focus();return}row[k]=v}
  const {error}=await sbc.from('kpi_settings').upsert(row);
  if(error){const m=$('#kSetMsg');m.className='fmsg neg';m.textContent='Chưa lưu được: '+error.message;return}

function kPL(a,s){
  // Cột "Cách tính" (tỷ lệ phí, cước, tỷ giá) chỉ admin và kế toán thấy.
  const how=CAN_KSET&&kShowHow;
  // Thanh tỷ trọng: độ dài = khoản đó ÷ doanh số gửi đi. Màu theo loại: doanh số (xanh), hoàn / đang xử lý (xám), chi phí (cam), kết quả (xanh ngọc; lỗ đỏ).
  const bar=(v,k)=>{const x=a.sent?Math.max(0,Math.min(1,Math.abs(v)/a.sent)):0;return `<span class="kbar k-${k}${k==='res'&&v<0?' neg':''}" aria-hidden="true"><i style="width:${(x*100).toFixed(1)}%"></i></span>`};
  const line=(lab,v,note,cls,k)=>{if(!how)note='';return `<tr class="${cls||''}"><td class="${cls?'':'ind'}">${lab}${note?`<div class="sub2 kpl-n">${note}</div>`:''}</td><td class="kb">${bar(v,k)}</td><td class="${k==='res'&&v<0?'neg':''}">${M(v)}</td><td class="muted">${pctOf(v,a.sent)}</td>${how?`<td class="l muted kpl-c" style="white-space:normal">${note}</td>`:''}</tr>`};
  const costs=a.ok-a.lng,parts=[['Hoàn',a.ret,'out'],['Đang xử lý',a.proc,'proc'],['Chi phí',Math.max(0,costs),'cost'],['Lợi nhuận gộp',Math.max(0,a.lng),'res']].filter(x=>x[1]>0);
  const tot=parts.reduce((t,x)=>t+x[1],0)||1;
  const side=`<div class="kplside">
    <div class="l">Lợi nhuận gộp (tính lương)</div>
    <div class="big${a.lng<0?' neg':''}">${M(a.lng)}</div>
    <div class="chips2"><span class="pill ${a.lng<0?'p-bad':'p-good'}">${pctOf(a.lng,a.sent)} doanh số gửi đi</span><span class="pill p-mute">${pctOf(a.lng,a.ok)} doanh số thành công</span></div>
    <div class="l" style="margin-top:18px">Doanh số gửi đi ${M(a.sent)} chia thành</div>
    <div class="stack" role="img" aria-label="${parts.map(([l,v])=>`${l} ${P(v/tot)}`).join(', ')}">${parts.map(([l,v,k])=>`<i class="k-${k}" style="width:${(v/tot*100).toFixed(2)}%" title="${l}: ${M(v)} (${P(v/tot)})"></i>`).join('')}</div>
    <ul class="legend2">${parts.map(([l,v,k])=>`<li><span class="dot k-${k}"></span><span class="ll">${l}</span><b>${M(v)}</b><span class="muted">${P(v/tot)}</span></li>`).join('')}</ul>
    ${a.lng<0?'<p class="msg neg" style="margin:12px 0 0">Chi phí lớn hơn doanh số thành công nên đang lỗ.</p>':''}
  </div>`;
  return `${CAN_KSET?`<div class="kpltools"><label class="toggle"><input type="checkbox" data-kshow ${how?'checked':''}> Hiện cách tính</label></div>`:''}<div class="kplwrap"><div class="tw"><table class="kpl"><thead><tr><th class="l">Khoản</th><th class="l kb">Tỷ trọng</th><th>Số tiền (đồng)</th><th>% gửi đi</th>${how?'<th class="l kpl-c">Cách tính</th>':''}</tr></thead><tbody>
    ${line('Doanh số gửi đi',a.sent,`${N(a.n)} đơn tạo trong kỳ, bỏ đơn huỷ`,'h top','in')}
    ${line('Hoàn',a.ret,'Đơn đang hoàn / đã hoàn','','out')}${line('Đang xử lý',a.proc,'Chưa gửi hoặc đang giao, chưa có kết quả','','proc')}
    ${line('Doanh số thành công',a.ok,'Đơn khách đã nhận hàng','sec s-ok','ok')}
    ${!SEE_COST?'':line('− Giá vốn',a.cogs,a.miss?`<span class="neg">${N(a.miss)} đơn chưa có giá vốn</span>`:'Giá nhập gần nhất tính đến ngày tạo đơn','','cost')}
    ${line('− Cước vận chuyển',a.ship,`${N(a.n)} đơn × ${PF(s.ship_local)} ₱`,'','cost')}
    ${line('− Phí dịch vụ vận chuyển',a.dvvc,`${PF(s.dvvc_pct)}% doanh số thành công`,'','cost')}
    ${line('− Phí dịch vụ GIP',a.gip,`${PF(s.gip_pct)}% doanh số thành công`,'','cost')}
    ${line('− Phí fulfill',a.ffm,`${PF(s.ffm_pct)}% doanh số gửi đi`,'','cost')}
    ${line('− Chi phí quảng cáo',a.ads,`${U(a.usd)} USD × ${N(s.usd_vnd)}`,'','cost')}
    ${line('− Chi phí test',a.test,`${PF(s.test_pct)}% doanh số gửi đi`,'','cost')}
    ${line('− Chi phí bao bì',a.pack,`${PF(s.pack_pct)}% doanh số gửi đi`,'','cost')}
    ${line('Lợi nhuận gộp (tính lương)',a.lng,'Doanh số thành công − các khoản trên','sec s-res','res')}
  </tbody></table></div>${side}</div>`;
}

// Hàng: chi phí ads / doanh số / số đơn / % chi phí / chi phí mỗi đơn, tách theo nhóm sản phẩm. Cột: tổng kỳ và từng ngày.
const TD={key:'',rows:[],usd:KDEF.usd_vnd,loading:false,err:''};
const CONTEST={key:null,rows:null,month:''};
// Bảng theo ngày lọc theo thị trường / kênh. Chưa chạy SQL 20261027010000_daily_filters.sql thì gọi bản cũ (không lọc) và báo.
let DAILY_OLD=false;
async function dailyRpc(fn,args,ord){
  const run=a=>fetchAll(()=>ord.reduce((q,c)=>q.order(c),sbc.rpc(fn,a)));
  if(!DAILY_OLD){const r=await run(Object.assign({p_market:F.mkt||null,p_channel:F.ch==='all'?null:F.ch},args));if(!r.error||!/function|schema cache/i.test(r.error.message))return r;DAILY_OLD=true}
  return run(args);
}
async function loadTD(key){
  const [from,to]=rangeDates();
  const [r,s]=await Promise.all([dailyRpc('team_daily',{p_from:dayISO(from),p_to:dayISO(to),p_project:F.proj||null},['day','team_id','grp']),getKSet(isoD(monthStart(from)))]);
  if(key!==TD.key)return;
  TD.loading=false;TD.usd=s.usd_vnd;
  if(r.error){TD.err=r.error.message;TD.rows=[]}else{TD.err='';TD.rows=r.data.map(x=>({day:x.day,team:x.team_id||'',grp:x.grp,n:+x.orders,rev:+x.revenue,usd:+x.ad_usd}))}
  if(view==='team'||view==='tongquan')render();
}

async function loadContest(key){
  const t=sod(new Date()),pf=new Date(t.getFullYear(),t.getMonth()-1,1),pt=new Date(t.getFullYear(),t.getMonth(),1);

  if(key!==CONTEST.key)return;

// Biểu đồ cột nhỏ trong ô "Xu hướng": vals = [[ngày, giá trị]], cap = trần (%) nếu là dòng % chi phí.
function dSpark(vals,fmt,cap){
  const v=vals.filter(x=>isFinite(x[1])),mx=Math.max(...v.map(x=>x[1]),cap||0);if(!v.length||!mx)return '<span class="z">–</span>';
  const n=vals.length,W=112,H=26,bw=W/n,lo=v.reduce((a,b)=>b[1]<a[1]?b:a),hi=v.reduce((a,b)=>b[1]>a[1]?b:a);
  const bars=vals.map(([d,x],i)=>{if(!isFinite(x)||x<=0)return '';const h=Math.max(1.5,x/mx*H);return `<rect x="${(i*bw+bw*.15).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${Math.max(1,bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="1"${cap&&x>cap?' class="o"':''}><title>${fmtD(d)}: ${fmt(x)}</title></rect>`}).join('');
  const cl=cap?`<line x1="0" x2="${W}" y1="${(H-cap/mx*H).toFixed(1)}" y2="${(H-cap/mx*H).toFixed(1)}"/>`:'';
  const lab=`Xu hướng: thấp nhất ${fmt(lo[1])} (${fmtD(lo[0])}), cao nhất ${fmt(hi[1])} (${fmtD(hi[0])})`;
  return `<svg class="dspark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(lab)}"><title>${esc(lab)}</title>${bars}${cl}</svg>`;
}

// Vẽ bảng theo dõi: rows = [{day, grp, n, rev, usd}]. o.teams: lấy target / trần % chi phí; o.targets=false thì chỉ hiện trần.
function dailyBody(rows,rate,o){
  const ds=days(),today=isoD(new Date()),title=o.title,teams=o.teams||[],contest=o.contest||'';
  const G=[1,2,3].concat(rows.some(r=>r.grp==null&&(r.n||r.usd))?[null]:[]);
  const Z=()=>({n:0,rev:0,usd:0}),add=(a,r)=>{a.n+=r.n;a.rev+=r.rev;a.usd+=r.usd};
  const by=new Map(),tot=Z();
  rows.forEach(r=>{[r.day+'|'+r.grp,r.day+'|*','*|'+r.grp,'*|*'].forEach(k=>{if(!by.has(k))by.set(k,Z());add(by.get(k),r)})});
  const get=(d,g)=>by.get(d+'|'+(g===undefined?'*':g))||Z();
  const tgt=o.targets===false?0:teams.reduce((a,t)=>a+(+t.target_vnd||0),0),g2=o.targets===false?0:teams.reduce((a,t)=>a+(+t.target_g2_vnd||0),0);
  const caps=[...new Set(teams.map(t=>+t.ads_pct_max||0).filter(Boolean))],cap=caps.length===1?caps[0]:0;
  // Chỉ tô màu chỗ vượt trần; dòng tổng giữ nhãn màu để thấy ngay ngày nào vượt.
  const pct=(a,strong)=>{if(!a.rev)return '<span class="z">–</span>';const v=a.usd*rate/a.rev,over=cap&&v*100>cap;
    if(!cap)return strong?`<b>${P(v)}</b>`:P(v);
    if(strong==='tot')return `<span class="pill ${over?'p-bad':'p-good'}" title="${over?'Vượt':'Trong'} trần ${PF(cap)}%">${P(v)}${over?' ▲':''}</span>`;
    if(strong)return over?`<span class="ovc" title="Vượt trần ${PF(cap)}%">${P(v)} ▲</span>`:P(v);
    return over?`<span class="ov" title="Vượt trần ${PF(cap)}%">${P(v)} ▲</span>`:P(v)};
  // Tiền trong bảng cùng một đơn vị: đồng (ghi ở đầu cột chỉ số).
  const Tr=v=>v?N(v):'<span class="z">–</span>';
  const lines=[
    ['Tổng chi phí ads (1)',a=>Tr(a.usd*rate),'h',undefined,'cost'],...G.map(g=>[GNAME(g),a=>Tr(a.usd*rate),'ind',g,'cost']),
    ['Doanh số tổng (2)',a=>Tr(a.rev),'h',undefined,'rev'],...G.map(g=>[GNAME(g),a=>Tr(a.rev),'ind',g,'rev']),
    ['Số đơn (3)',a=>a.n?N(a.n):'<span class="z">–</span>','h',undefined,'ord'],
    ['% chi phí = (1) ÷ (2)',(a,t)=>pct(a,t?'tot':1),'h',undefined,'pct'],...G.map(g=>[GNAME(g),a=>pct(a),'ind',g,'pct']),
    ['Chi phí / đơn = (1) ÷ (3)',a=>a.n?N(a.usd*rate/a.n):'<span class="z">–</span>','h',undefined,'cpo']].filter(l=>dlyGrp||l[2]==='h');
  // Giá trị từng ngày cho cột "Xu hướng" (chỉ dòng tổng, chỉ tới hôm nay).
  const SV={cost:a=>a.usd*rate,rev:a=>a.rev,ord:a=>a.n,pct:a=>a.rev?a.usd*rate/a.rev*100:NaN,cpo:a=>a.n?a.usd*rate/a.n:NaN};
  const SF={cost:N,rev:N,ord:N,pct:x=>PF(x)+'%',cpo:N};
  const past=ds.filter(d=>isoD(d)<=today);
  const showTr=ds.length>2;
  const spark=sec=>dSpark(past.map(d=>[d,SV[sec](get(isoD(d)))]),SF[sec],sec==='pct'?cap:0);
  const we=d=>d.getDay()===0||d.getDay()===6;
  const wk=d=>d.getDay()===1&&+d!==+ds[0]?' wk':'';
  const head=`<tr><th class="l">Chỉ số<div class="sub2">tiền: đồng</div></th><th class="tot">Tổng<div class="sub2">${esc(rangeLabel())}</div></th>${showTr?'<th class="trend">Xu hướng<div class="sub2">theo ngày</div></th>':''}${ds.map(d=>`<th class="${we(d)?'we':''}${wk(d)}${isoD(d)===today?' today':''}">${isoD(d)===today?'Hôm nay':WD[d.getDay()]}<div class="sub2">${fmtD(d)}</div></th>`).join('')}</tr>`;
  const gdot=g=>g===undefined?'':`<span class="gdot g${g||0}" aria-hidden="true"></span>`;
  const body=lines.map(([lab,f,cls,g,sec],i)=>`<tr class="${cls==='h'?'h':''} s-${sec}${cls==='h'&&i?' first':''}"><td class="${cls==='ind'?'ind':''}">${gdot(g)}${lab}</td><td class="tot">${f(get('*',g),1)}</td>${showTr?`<td class="trend">${cls==='h'?spark(sec):''}</td>`:''}${ds.map(d=>{const k=isoD(d);return `<td class="${we(d)?'we':''}${wk(d)}${k===today?' today':''}${k>today?' fut':''}">${k>today?'<span class="z">–</span>':f(get(k,g))}</td>`}).join('')}</tr>`).join('');
  const T=get('*'),T2=get('*',2),dim=new Date(ds[0].getFullYear(),ds[0].getMonth()+1,0).getDate();
  // Dải chỉ số trên bảng: target (nếu có) và % chi phí so với trần. Chỉ hiện ô có số.
  const pv=T.rev?T.usd*rate/T.rev:NaN,over=cap&&pv*100>cap;
  const cells=[];
  if(tgt)cells.push(['Target tháng',M(tgt),`đã đạt ${M(T.rev)} · ${P(T.rev/tgt)}`,T.rev/tgt],['Target tuần · ngày',M(tgt/dim*7),'ngày '+M(tgt/dim)]);
  if(g2)cells.push(['Target doanh số nhóm 2',M(g2),`đã đạt ${M(T2.rev)} · ${P(T2.rev/g2)} · ngày ${M(g2/dim)}`,T2.rev/g2]);
  if(o.targets===false)cells.push(['Chi phí ads',M(T.usd*rate),`${U(T.usd)} USD`],['Doanh số',M(T.rev),`${N(T.n)} đơn`]);
  cells.push([`% chi phí ads${cap?` (trần ${PF(cap)}%)`:''}`,`<span class="${over?'neg':''}">${isFinite(pv)?P(pv):'–'}</span>`,cap?(over?'▲ đang vượt trần':'trong mức cho phép'):'Chưa đặt trần',cap&&isFinite(pv)?pv*100/cap:undefined,over]);
  if(o.targets===false)cells.push(['Chi phí / đơn',T.n?N(T.usd*rate/T.n):'–','']);
  const strip=tgt||g2||cap||o.targets===false?`<div class="statstrip" style="margin:4px 0 14px">${cells.slice(0,4).map(([l,v,sub,pr,bad])=>`<div><span class="l">${l}</span><b>${v}</b>${pr!==undefined?`<span class="prog${bad?' bad':''}" role="img" aria-label="${P(Math.min(pr,1))}"><i style="width:${Math.max(0,Math.min(100,pr*100)).toFixed(1)}%"></i></span>`:''}<span class="muted">${sub}</span></div>`).join('')}</div>`:'';
  const canTgt=['admin','quan_ly'].includes(ME.role);
  const dtipTxt=`Chi phí ads (USD × ${N(rate)}) ${o.targets===false?'do người này nhập':'theo team của người nhập'}; doanh số và số đơn theo ngày tạo đơn, bỏ đơn huỷ; nhóm theo sản phẩm chính của đơn.${DAILY_OLD?' Bảng này chưa lọc theo kênh / thị trường.':' Doanh số, số đơn theo thị trường và kênh đang lọc; chi phí ads theo kênh marketer chọn khi nhập.'}${cap?` Ô có ▲ là vượt trần ${PF(cap)}%.`:''}${!tgt&&canTgt&&o.targets!==false?' Đặt target, trần % chi phí ở Quản trị → Danh mục → Team.':''}`.replace(/<[^>]+>/g,'');
  const dtip=`<span class="tip" tabindex="0" role="note" aria-label="${esc(dtipTxt)}" data-tip="${esc(dtipTxt)}">?</span>`;
  const segG=`<div class="seg" role="group" aria-label="Cách xem bảng">${[[0,'Gọn'],[1,'Theo nhóm sản phẩm']].map(([k,l])=>`<button type="button" data-dlygrp="${k}" class="${+dlyGrp===k?'on':''}" aria-pressed="${+dlyGrp===k}">${l}</button>`).join('')}</div>`;
  return `<div class="card blk c-cyan dly"><div class="cardhead"><div><h2>${title} ${dtip}</h2></div>${segG}</div>
    ${(F.ch!=='all')?`<div class="warnrow">${DAILY_OLD?`<span class="pill p-warn">Chưa lọc theo kênh ${tipT('Bảng đang hiện số của mọi kênh. Admin chạy file SQL 20261027010000_daily_filters.sql trên Supabase để bảng lọc theo kênh / thị trường.')}</span>`:`<span class="pill p-info">Chi phí ads: ${esc(fList('ch').map(x=>x==='__none'?'chưa chọn kênh':adChName(x)).join(', '))} ${tipT('Chỉ tính chi phí marketer chọn kênh này khi nhập. Khoản nhập trước khi có ô Kênh (chưa chọn kênh) chỉ được tính khi xem Mọi kênh. Nếu chi phí vẫn ra của mọi kênh, admin cần chạy file SQL 20261027020000_ad_channel.sql.')}</span>`}</div>`:''}
    ${contest}${strip}
    ${rows.length?(()=>{const showTr=ds.length>2,mw=230+140+(showTr?132:0)+ds.length*112,cg=`<colgroup><col style="width:230px"><col style="width:140px">${showTr?'<col style="width:132px">':''}${ds.map(()=>'<col style="width:112px">').join('')}</colgroup>`;
      return `<div class="fh"><table class="daily" style="width:100%;min-width:${mw}px">${cg}<thead>${head}</thead></table></div><div class="tw fhb"><table class="daily" style="width:100%;min-width:${mw}px">${cg}<tbody>${body}</tbody></table></div>`})():Shell.empty('inbox','Chưa có số trong khoảng này','Chưa có đơn hoặc chi phí ads nào.')}</div>`;
}

function ensureKP(){

// Phần chi phí chung của tháng ứng với khoảng đang xem (theo số ngày).
function monthShare(){const [f,t]=rangeDates(),dim=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();return Math.min(1,Math.round((t-f)/864e5)/dim)}
// Bảng kết quả cho một nhóm đơn: share = phần chi phí chung (Việt Nam, kho, thu / chi khác) gánh, chia theo doanh thu đã giao.
function plCalc(a,s,share){
  const c=kCalc(a,s),o=KP.other||{},x=k=>(+o[k]||0)*share;
  const shipOk=c.n?c.ship*(a.okN||0)/c.n:0,shipRet=c.n?c.ship*(a.retN||0)/c.n:0,shipProc=c.ship-shipOk-shipRet;
  const direct=c.ship+c.cogs+c.dvvc+c.gip+c.ffm+c.ads,gp3=c.ok-direct;
  const vn=x('qldn_vn')+x('nguyen_lieu')+x('luong_vn'),kho=x('kho_phil'),net=gp3-c.test-c.pack-vn-kho,profit=net+x('thu_nhap_khac')-x('chi_phi_khac');
  return Object.assign(c,{shipOk,shipRet,shipProc,direct,gp3,vn,qldn:x('qldn_vn'),nl:x('nguyen_lieu'),luong:x('luong_vn'),kho,tnk:x('thu_nhap_khac'),cpk:x('chi_phi_khac'),net,profit});
}
// Theo sản phẩm: chi phí chung chia theo doanh thu đã giao của sản phẩm trên tổng doanh thu đang xem.
function kpProducts(rows){
  const totOk=KP.rows.reduce((t,r)=>t+r.ok,0)||1,ms=monthShare();
  return new Map(kSum(rows,r=>r.pk).map(a=>[a.k,plCalc(a,KP.set,ms*a.ok/totOk)]));
}

function readAdFile(file){
  const fr=new FileReader();
  fr.onload=e=>{try{
    const wb=/\.csv$/i.test(file.name)?XLSX.read(new TextDecoder('utf-8').decode(e.target.result).replace(/^﻿/,''),{type:'string'}):XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true});
    if(!data.length){adImp={err:'File không có dòng dữ liệu nào.',rows:[],skip:[]};render();return}
    const keys=Object.keys(data[0]),nk=k=>k.normalize('NFC').toLowerCase().trim(),find=(...c)=>{for(const x of c){const k=keys.find(k=>nk(k)===x||nk(k).includes(x));if(k)return k}};
    const kC=AD.noCh?null:find('kênh','channel','nền tảng','platform'),kD=find('ngày','date','day'),kS=find('nhân sự','nhân viên','marketer','mkt','ads','người'),kP=find('product','sản phẩm','tên sp'),kU=find('usd','chi phí','tổng','spend','tiền');
    if(!kS||!kP||!kU){adImp={err:`Không tìm thấy đủ cột Nhân sự, Sản phẩm, USD. Các cột trong file: ${keys.join(', ')}.`,rows:[],skip:[]};render();return}
    const staff=adStaffList(),match=n=>{const q=pkey(n);if(!q)return null;const ex=staff.filter(s=>pkey(s.name)===q||(s.pos_names||[]).some(p=>pkey(p)===q));if(ex.length===1)return ex[0].id;const tail=staff.filter(s=>pkey(s.name).split(/\s+/).pop()===q);return tail.length===1?tail[0].id:null};
    const day=v=>{if(typeof v==='number'&&v>20000){const d=new Date(Math.round((v-25569)*864e5));return isoD(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}const m=String(v).trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return `${m[3]}-${p2(m[2])}-${p2(m[1])}`;const m2=String(v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0].slice(0,10):null};
    const rows=new Map(),skip=[];
    data.forEach((r,i)=>{const ln=i+2,name=String(r[kP]).trim(),u=typeof r[kU]==='number'?r[kU]:parseFloat(String(r[kU]).replace(/[^\d,.-]/g,'').replace(',','.'));
      if(!name&&!r[kS])return;
      const sid=match(r[kS]);if(!sid){skip.push(`dòng ${ln}: không nhận ra nhân sự “${r[kS]}”`);return}
      if(!name){skip.push(`dòng ${ln}: thiếu sản phẩm`);return}
      if(!(u>=0)){skip.push(`dòng ${ln}: USD không hợp lệ`);return}
      if(!u)return;
      const d=kD?day(r[kD]):adDay;if(!d){skip.push(`dòng ${ln}: ngày “${r[kD]}” không đọc được`);return}
      let ch='';if(kC&&String(r[kC]).trim()){const q=pkey(r[kC]),c=CAT.channels.find(c=>pkey(c.id)===q||pkey(c.name)===q||(c.keywords||[]).some(w=>pkey(w)===q));if(!c){skip.push(`dòng ${ln}: không nhận ra kênh “${r[kC]}”`);return}ch=c.id}
      const k=d+'|'+sid+'|'+pkey(name)+'|'+ch,o=rows.get(k);
      if(o)o.usd=Math.round((o.usd+u)*100)/100;else rows.set(k,Object.assign({day:d,staff_id:sid,product_key:pkey(name),product_name:name,usd:Math.round(u*100)/100},AD.noCh?{}:{channel_id:ch}));
    });
    adImp={rows:[...rows.values()],skip,noDate:!kD,noCh:!AD.noCh&&!kC};render();
  }catch(err){adImp={err:'Không đọc được file: '+err.message,rows:[],skip:[]};render()}};
  fr.readAsArrayBuffer(file);
}

  (data||[]).forEach(r=>{if(r.on_hand==null)return;const k=String(r.product_key);const a=m.get(k)||{on:0,s30:0,name:r.name||r.code};a.on+=+r.on_hand-(+r.cho_gui||0);a.s30+=+r.sold_30d;m.set(k,a)});
  m.forEach(a=>{const avg=a.s30/30;a.st=a.on<=0?'het':avg>0&&a.on/avg<7?'sap':a.s30===0?'lau':'on';a.days=avg>0?Math.floor(a.on/avg):null});STK=m;render()})}
function stockTag(code){const a=STK&&STK.get(String(code||'').trim().toLowerCase());if(!a||(a.st!=='het'&&a.st!=='sap'))return '';
  return ` · <a class="pill ${a.st==='het'?'p-bad':'p-warn'}" href="tonkho.html#ton?st=${a.st}" title="${a.st==='het'?(a.on<0?'Có thể bán: âm '+N(-a.on)+' (đã nhận đơn vượt số hàng)':'Có thể bán: hết hàng'):'Có thể bán: còn '+N(a.on)+', đủ bán khoảng '+N(a.days)+' ngày'}">${a.st==='het'?'Hết hàng':'Sắp hết'}</a>`}
function alerts(){
  const out=[];
  if(STK){const c=st=>[...STK.values()].filter(a=>a.st===st);const lnk=st=>`<a href="tonkho.html#ton?st=${st}">Xem tồn kho</a>`,nm=l=>l.slice(0,4).map(a=>a.name).join(', ')+(l.length>4?'…':'');
    const h=c('het'),s=c('sap');
    if(h.length)out.push(['bad','Hết hàng',`${h.length} sản phẩm đã hết trong kho: ${nm(h)}`,lnk('het')]);
    if(s.length)out.push(['warn','Sắp hết hàng',`${s.length} sản phẩm chỉ đủ bán dưới 7 ngày: ${nm(s)}`,lnk('sap')]);}
  if(SEE_COST){const miss=new Set();(PRODS?PRODS.rows:[]).forEach(r=>{if(r.unit==null&&r.g!=='cancel')miss.add(r.code)});
    if(miss.size)out.push(['warn','Sản phẩm chưa có giá vốn',`${miss.size} sản phẩm đang bán chưa có dữ liệu nhập hàng: ${[...miss].slice(0,5).join(', ')}${miss.size>5?'…':''}`,Auth.ADMIN_TABS.giavon.includes(ME.role)?'<a href="admin.html#giavon">Tải giá vốn</a>':'Báo kế toán'])}
  SHOPS.filter(s=>s.active!==false&&s.last_sync_status==='error').forEach(s=>out.push(['bad','Shop đồng bộ lỗi',`${s.name}: ${s.last_sync_error||''}`,ME.role==='admin'?'<a href="admin.html#pos">Xem</a>':'Báo admin']));
  if(UNMAPPED){const mk=UNMAPPED.filter(u=>u.kind==='marketer'),src=UNMAPPED.filter(u=>u.kind==='source');
    if(mk.length)out.push(['warn','Marketer chưa khai báo',`${mk.length} tên marketer (${N(mk.reduce((s,u)=>s+ +u.orders,0))} đơn) chưa thuộc team nào: ${mk.slice(0,4).map(u=>u.value).join(', ')}${mk.length>4?'…':''}`,'<a href="admin.html#chuakhaibao">Khai báo</a>']);
    if(src.length)out.push(['warn','Nguồn đơn chưa thuộc kênh',`${src.slice(0,4).map(u=>u.value).join(', ')}${src.length>4?'…':''}`,'<a href="admin.html#chuakhaibao">Gán kênh</a>'])}
  agg(ROWS.filter(r=>r.staff),r=>r.staff).forEach(a=>{const rr=retRate(a);if(a.ok+a.ret>=20&&rr>.35)out.push(['bad','Tỷ lệ hoàn cao',`${staffName(a.k)}: hoàn ${P(rr)} trên ${N(a.ok+a.ret)} đơn đã xong`,ALLOWED.includes('nhansu')?`<button class="lnk" data-go="nhansu:${esc(a.k)}">Xem nhân sự</button>`:'Kiểm tra']);else if(a.ok+a.ret>=20&&rr>.28)out.push(['warn','Tỷ lệ hoàn đang tăng',`${staffName(a.k)}: hoàn ${P(rr)}`,ALLOWED.includes('nhansu')?`<button class="lnk" data-go="nhansu:${esc(a.k)}">Xem nhân sự</button>`:'Theo dõi'])});
  if(F.range==='month'){const t=new Date(),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(),pace=t.getDate()/dim;
    agg(ROWS.filter(r=>r.team),r=>r.team).forEach(a=>{const tm=byId(CAT.teams,a.k);if(tm&&+tm.target_vnd&&a.rev/tm.target_vnd<pace-.15)out.push(['warn','Chậm target',`${tm.name}: đạt ${P(a.rev/tm.target_vnd)} target, đã qua ${P(pace,0)} tháng`,ALLOWED.includes('team')?`<button class="lnk" data-go="team:${esc(a.k)}">Xem team</button>`:''])})}
  const o={bad:0,warn:1,info:2};return out.sort((a,b)=>o[a[0]]-o[b[0]]);
}
V.canhbao=()=>{const a=alerts();
  // Mức độ: đỏ = cần xử lý ngay, vàng = cần chú ý, còn lại = thông tin. Mỗi dòng có biểu tượng, chữ mức độ và nút việc cần làm.
  const SV={bad:['Cần xử lý ngay','alert','i-red','p-bad'],warn:['Cần chú ý','bell','i-amber','p-warn'],info:['Thông tin','inbox','i-blue','p-info']};
  const sv=k=>SV[k]||SV.info,cnt=k=>a.filter(x=>(SV[x[0]]?x[0]:'info')===k).length;
  const strip=`<div class="statstrip ist">${[['Tổng cảnh báo',a.length,'list','i-purple'],['Cần xử lý ngay',cnt('bad'),'alert','i-red'],['Cần chú ý',cnt('warn'),'bell','i-amber'],['Thông tin',cnt('info'),'inbox','i-blue']].map(([l,v,ic,c])=>`<div>${ico(ic,c)}<div><span class="l">${l}</span><b>${N(v)}</b></div></div>`).join('')}</div>`;
  const order={bad:0,warn:1,info:2},list=a.slice().sort((x,y)=>(order[x[0]]??2)-(order[y[0]]??2));
  return `${strip}<div class="card c-red"><div class="cardhead"><div><h2>${a.length} cảnh báo đang mở ${tipT('Tính từ dữ liệu POS theo bộ lọc đang chọn. Tỷ lệ hoàn chỉ xét nhân sự có từ 20 đơn đã xong.')}</h2></div></div>
  <div class="alerts">${list.map(x=>{const v=sv(x[0]);return `<div class="alert a-${SV[x[0]]?x[0]:'info'}"><span class="stripe s-${SV[x[0]]?x[0]:'info'}"></span>${ico(v[1],v[2])}<div><div class="t">${esc(x[1])} <span class="pill ${v[3]}">${v[0]}</span></div><div class="m">${esc(x[2])}</div></div><div class="act">${x[3]}</div></div>`}).join('')||Shell.empty('check','Không có cảnh báo','Mọi thứ đang ổn trong khoảng đang lọc.')}</div></div>`};

const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
async function submitFfm(){
  const name=val('ffName');
  if(!name){formMsg.ffm='<span class="neg">Nhập tên đơn vị.</span>';$('#ffmMsg').innerHTML=formMsg.ffm;return}
  const fee=parseFloat(val('ffFee')),ship=parseFloat(val('ffShip'));
  if(!(fee>=0)||!(ship>=0)){formMsg.ffm='<span class="neg">Điền phí dịch vụ và cước là số từ 0 trở lên.</span>';$('#ffmMsg').innerHTML=formMsg.ffm;return}
  const cur=editFfm?FFMS.find(f=>f.id===editFfm):null;
  const data={name,warehouse:val('ffWh'),feePct:fee,shipPhp:ship,share:cur?cur.share:0,note:val('ffNote')};
  const id=editFfm||(name.toLowerCase().replace(/[^a-z0-9]+/g,'')||'f'+Date.now().toString(36));
  if(!editFfm&&FFMS.some(f=>f.id===id)){formMsg.ffm='<span class="neg">Đã có đơn vị trùng tên.</span>';$('#ffmMsg').innerHTML=formMsg.ffm;return}
  try{await db.collection('ffm').doc(id).set(data);formMsg.ffm=`<span class="pos">${editFfm?'Đã lưu':'Đã thêm'} ${esc(name)}.</span>`;editFfm=null;render()}
  catch(e){formMsg.ffm=`<span class="neg">Chưa lưu được: ${esc(e.message||e)}.</span>`;$('#ffmMsg').innerHTML=formMsg.ffm}
}

  const aa=e.target.closest('[data-adadd]');if(aa){const r=readAdForm().filter(x=>x.name||x.usd);r.push({name:aa.dataset.adadd,usd:'',ch:aa.dataset.adch||adDefCh()});adEdit=r;render();const ins=document.querySelectorAll('#adForm .adUsd');if(ins.length>1)ins[ins.length-2].focus();return}
  if(e.target.id==='adImpBtn'){adImpOpen=!adImpOpen;render();return}
  if(e.target.id==='adImpClose'){adImpOpen=false;adImp=null;render();return}
  if(e.target.id==='adImpGo'){e.target.disabled=true;runAdImport();return}
  const so=e.target.closest('[data-sort]');if(so){pSort=so.dataset.sort;store.set('psort2',pSort);pgState('prod').page=0;render();return}
  const st=e.target.closest('[data-st]');if(st){oSt=st.dataset.st;pgState('orders').page=0;render();return}
  const pgb=e.target.closest('[data-pgto]');if(pgb&&!pgb.disabled){pgState(pgb.dataset.pgk).page=Math.max(0,+pgb.dataset.pgto);render();const t=pgb.closest('.card');if(t&&t.getBoundingClientRect().top<0)t.scrollIntoView({block:'start'});return}
  const ef=e.target.closest('[data-edit-ffm]');if(ef){editFfm=ef.dataset.editFfm;delArm=null;formMsg.ffm='';keep={};render();$('#ffmForm').scrollIntoView({block:'center'});$('#ffName').focus();return}
  if(e.target.id==='ffCancel'){editFfm=null;formMsg.ffm='';keep={};render();return}
  const df=e.target.closest('[data-del-ffm]');if(df){const id=df.dataset.delFfm;if(delArm==='f:'+id){delArm=null;const nm=(FFMS.find(f=>f.id===id)||{}).name;db.collection('ffm').doc(id).delete().then(()=>{formMsg.ffm=`<span class="muted">Đã xoá ${esc(nm)}.</span>`;if(editFfm===id)editFfm=null;render()}).catch(err=>{formMsg.ffm=`<span class="neg">Chưa xoá được: ${esc(err.message||err.code)}.</span>`;render()})}else{delArm='f:'+id;render()}return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MP){closeM();return}if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-go]'))e.target.click();
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-pggo]')){e.preventDefault();pgGo(e.target)}});

document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='ffmForm')submitFfm();if(e.target.id==='kSetForm')saveKSet();if(e.target.id==='adForm')saveAds();if(e.target.id==='plForm')savePL()});
document.addEventListener('change',e=>{
  if(e.target.matches&&e.target.matches('[data-pgper]')){const k=e.target.dataset.pgper,st=pgState(k);st.per=+e.target.value;st.page=0;store.set('per_'+k,String(st.per));render();return}
  if(e.target.matches&&e.target.matches('[data-pggo]')){pgGo(e.target);return}
  if(e.target.id==='fProj')setF('proj',e.target.value);
  if(e.target.matches&&e.target.matches('[data-mv]')&&MP){const v=e.target.dataset.mv;MP.sel=e.target.checked?[...MP.sel,v]:MP.sel.filter(x=>x!==v);syncM();return}
  if(e.target.matches&&e.target.matches('[data-mall]')&&MP){MP.sel=[];syncM();return}
  if(e.target.id==='fRange'){const k=e.target.value;if(k==='custom'&&!(F.from&&F.to)){const [f,t]=rangeDates();F.from=isoD(f);F.to=isoD(addD(t,-1));store.set('from',F.from);store.set('to',F.to)}setF('range',k)}
  if(e.target.id==='fCmp')setF('cmp',e.target.checked);
  if(e.target.id==='fFrom'||e.target.id==='fTo'){const k=e.target.id==='fFrom'?'from':'to';if(e.target.value){F[k]=e.target.value;store.set(k,F[k]);setF('range','custom')}}
  if(e.target.id==='staffSel'){curStaff=e.target.value;store.set('staff',curStaff);pgState('prodStaff').page=0;render()}
  if(e.target.id==='jtFile'&&e.target.files[0])runJT(e.target.files[0]);
  if(e.target.id==='kWhoSel'){kWho=e.target.value;render()}
  if(e.target.matches&&e.target.matches('[data-kshow]')){kShowHow=e.target.checked;render()}
  if(e.target.id==='kAllProds'){kAllProds=e.target.checked;store.set('kallp',kAllProds?'1':'0');render()}
  if(e.target.id==='adDay'&&e.target.value){adDay=e.target.value;adEdit=null;render()}
  if(e.target.id==='adStaff'){if(adLeave()){adStaff=e.target.value;store.set('adstaff',adStaff);adEdit=null}render()}
  if(e.target.id==='adFile'&&e.target.files[0])readAdFile(e.target.files[0]);
  if(e.target.matches&&e.target.matches('#adForm .adName')){const r=readAdForm();adEdit=r;const i=+e.target.closest('.adrow').dataset.i;if(i===r.length-1&&r[i].name){render();const n=document.querySelector(`#adForm .adrow[data-i="${i}"] .adUsd`);if(n)n.focus()}}
});
function liveSearch(id,set){document.addEventListener('input',e=>{if(e.target.id!==id)return;set(e.target.value);const pos=e.target.selectionStart;render();const el=$('#'+id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(x){}}})}
liveSearch('pq',v=>{pQ=v;pgState('prod').page=0});
liveSearch('oq',v=>{oQ=v;pgState('orders').page=0});
document.addEventListener('input',e=>{if(!(e.target.matches&&e.target.matches('#adForm .adUsd, #adForm .adName, #adForm .adCh')))return;
  // Gõ: chỉ cập nhật VNĐ, tổng và trạng thái "chưa lưu", không vẽ lại cả màn để giữ con trỏ.
  adEdit=readAdForm();
  if(e.target.classList.contains('adUsd'))e.target.closest('.adrow').querySelector('.vnd').textContent=e.target.value!==''?M(usdOf(e.target.value)*AD.usd):'–';
  const t=adEdit.reduce((s,r)=>s+usdOf(r.usd),0);$('#adTotUsd').textContent=U(t)+' USD';$('#adTotVnd').textContent=M(t*AD.usd);
  const st=$('#adState');if(st&&adDirty()){st.className='pill p-warn';st.textContent='Chưa lưu thay đổi'}});
// Enter: tên sản phẩm → ô USD; ô USD → dòng sau (thêm dòng mới nếu đang ở dòng cuối). Không gửi form khi bấm Enter.
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!e.target.closest||!e.target.closest('#adForm .adrow'))return;
  e.preventDefault();const row=e.target.closest('.adrow');
  if(e.target.classList.contains('adName')){(row.querySelector('.adCh')||row.querySelector('.adUsd')).focus();return}
  if(e.target.classList.contains('adCh')){row.querySelector('.adUsd').focus();return}
  const nx=row.nextElementSibling;if(nx&&nx.classList.contains('adrow')){nx.querySelector('.adName').focus();return}
  const r=readAdForm();if(r[r.length-1].name||r[r.length-1].usd){r.push({name:'',usd:'',ch:adDefCh()})}adEdit=r;render();const ins=document.querySelectorAll('#adForm .adName');if(ins.length)ins[ins.length-1].focus()});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.toggle('over',ev==='dragover');if(ev==='drop'&&e.dataTransfer.files[0])runJT(e.dataTransfer.files[0])}));

// Trang mở đầu theo vai trò: kế toán → KQKD, vận đơn / kho → Đơn hàng, còn lại → Tổng quan.
const HOME={ke_toan:'kqkd',van_don:'donhang',kho:'donhang'}[ME.role];
const h=(location.hash||'').slice(1).split('?')[0];
view=V[h]&&ALLOWED.includes(h)?h:(HOME&&ALLOWED.includes(HOME)?HOME:ALLOWED[0]);
try{history.replaceState(null,'',hashFor(view))}catch(e){}
render();loadData();loadStock();
sbc.from('pos_shops').select('id,name,active,last_sync_status,last_sync_error').then(({data})=>{SHOPS=data||[]});
if(ME.role==='admin'||ME.role==='quan_ly')sbc.rpc('admin_unmapped').then(({data})=>{UNMAPPED=data||[];render()});

// Đơn vị FFM dùng chung (bảng ffm_units).
(async()=>{
  db=SettingsDB(sbc);
  db.collection('ffm').onSnapshot(s=>{FFMS=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(+b.share||0)-(+a.share||0));dbState='ok';if(view==='caidat'||view==='kqkd')render()},err=>{dbState='off';dbErr=err.code||'';render()});
})();

// ---------- cập nhật từ POS khi mở trang ----------
// Mở trang, quay lại tab, hoặc cứ 2 phút khi tab đang hiện: server kéo phần đơn mới nhất từ POS rồi trang tải lại số.
let lastRefresh=0,refreshing=false,freshAt=null,freshErr='';
const hhmm=t=>new Date(t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
function showFresh(){
  const el=$('#fresh');if(!el)return;
  el.className='fresh'+(freshErr?' err':'');
  el.title=freshErr?'Không cập nhật được: '+freshErr:'';
  const txt=refreshing?'<span class="spin" aria-hidden="true"></span><span>Đang cập nhật…</span>'
    :freshErr?'<span class="dotlive"></span><span class="neg">Chưa cập nhật được từ POS</span>'
    :freshAt?`<span class="dotlive"></span><b title="Dữ liệu POS cập nhật lúc ${hhmm(freshAt)}">${hhmm(freshAt).slice(0,5)}</b>`:'<span class="dotlive" style="background:var(--faint);box-shadow:none"></span><span>Chưa nối POS</span>';
  el.innerHTML=txt+(refreshing?'':`<button class="ibtn sm" id="refreshNow" aria-label="Cập nhật số mới nhất từ POS" title="Cập nhật số mới nhất từ POS">${Shell.icon('refresh')}</button>`);
}
async function refreshPOS(){
  if(refreshing)return;refreshing=true;showFresh();
  try{const r=await Auth.callFn('pos',{action:'refresh'});freshErr='';freshAt=r.synced_at}
  catch(e){freshErr=e.message}
  lastRefresh=Date.now();refreshing=false;showFresh();
  loadData();
}
document.addEventListener('click',e=>{if(e.target.closest('#refreshNow'))refreshPOS()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastRefresh>60000)refreshPOS()});
setInterval(()=>{if(document.visibilityState==='visible')refreshPOS()},120000);
refreshPOS();
})();
</script>
