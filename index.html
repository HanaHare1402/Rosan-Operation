<html lang="vi" class="auth-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bảng điều hành Team Vương</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

</head>
<body>

<div class="app">
  <aside>
    <div class="brand">Team Vương · Phil</div>
    <div class="brand-sub">Bảng điều hành vận hành</div>
    <nav id="nav">
      <a href="#tongquan" data-v="tongquan">Tổng quan</a>
      <a href="#team" data-v="team">Team</a>
      <a href="#nhansu" data-v="nhansu">Nhân sự</a>
      <a href="#sanpham" data-v="sanpham">Sản phẩm</a>
      <a href="#donhang" data-v="donhang">Đơn hàng</a>
      <a href="#kqkd" data-v="kqkd">KQKD</a>
      <a href="#canhbao" data-v="canhbao">Cảnh báo <span class="cnt" id="alertCnt">0</span></a>
      <a href="#caidat" data-v="caidat">Cài đặt</a>
    </nav>
    <div class="side-foot" id="sideFoot"></div>
    <div class="userbox"><span class="who" id="who"></span><span class="muted" id="whoRole"></span><div class="acts"><a class="lnk" id="adminLink" href="admin.html" hidden>Quản trị</a><button class="lnk" id="logout">Đăng xuất</button></div></div>
  </aside>
  <main>
    <div class="topbar">
      <div><h1 id="title">Tổng quan</h1><p class="sub" id="subtitle"></p><p class="fresh" id="fresh" role="status"></p></div>
      <div class="filters" id="filters"></div>
    </div>
    <div class="filters" id="filters2" style="margin-bottom:16px"></div>
    <section id="view"></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/dist/umd/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/settings-db.js"></script>
<script>
(async function(){
// ---------- đăng nhập và quyền ----------
const ME=await Auth.requireAuth();
if(!ME.role){location.replace('login.html');return}
const ALLOWED=Auth.VIEWS[ME.role]||[];
const sbc=Auth.sb;
const $=s=>document.querySelector(s);
document.querySelectorAll('#nav a').forEach(a=>{a.hidden=!ALLOWED.includes(a.dataset.v)});
$('#who').textContent=ME.full_name||ME.email;
$('#whoRole').textContent=Auth.ROLES[ME.role]+' · '+Auth.SCOPES[ME.scope||'self'];
$('#adminLink').hidden=!(ME.role==='admin'||ME.role==='quan_ly');
$('#logout').addEventListener('click',()=>Auth.signOut());
document.documentElement.classList.remove('auth-pending');

// ---------- tiện ích ----------
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=new Intl.NumberFormat('vi-VN');
const N=v=>nf.format(Math.round(v||0));
function M(v){v=v||0;const a=Math.abs(v),s=v<0?'−':'';if(a>=1e9)return s+(a/1e9).toFixed(2).replace('.',',')+' tỷ';if(a>=1e6)return s+(a/1e6).toFixed(1).replace('.',',')+' tr';return s+N(a)}
const PF=v=>String(v).replace('.',',');
const P=(v,d=1)=>isFinite(v)?(v*100).toFixed(d).replace('.',',')+'%':'–';
const store={get(k,d){try{const v=localStorage.getItem('tv_'+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('tv_'+k,v)}catch(e){}}};
const byId=(l,id)=>l.find(x=>x.id===id);

// ---------- danh mục ----------
let CAT={projects:[],teams:[],markets:[],channels:[],staff:[]},catErr='';
try{CAT=await Auth.loadCatalog()}catch(e){catErr=e.message}
let PHP=(byId(CAT.markets,'ph')||CAT.markets[0]||{rate_vnd:403}).rate_vnd;
const projName=id=>id?(byId(CAT.projects,id)||{name:'(dự án đã xoá)'}).name:'(chưa gán dự án)';
const teamName=id=>id?(byId(CAT.teams,id)||{name:'(team đã xoá)'}).name:'(chưa gán team)';
const staffName=(id,fallback)=>id?(byId(CAT.staff,id)||{name:fallback||'(nhân sự đã xoá)'}).name:(fallback?fallback+' · chưa khai báo':'(không có marketer)');
const chName=id=>id?(byId(CAT.channels,id)||{name:id}).name:'Chưa xác định';
const chColor=id=>(byId(CAT.channels,id)||{color:'#8a9289'}).color;
const chTag=id=>`<span class="ch"><span class="dot" style="background:${esc(chColor(id))}"></span>${esc(chName(id))}</span>`;
$('#sideFoot').innerHTML=CAT.markets.map(m=>`${esc(m.name)}: 1 ${esc(m.currency)} = ${N(m.rate_vnd)} đ`).join('<br>');

// ---------- bộ lọc ----------
const fmtD=d=>d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});
function sod(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
const RANGES={today:'Hôm nay',yesterday:'Hôm qua','7d':'7 ngày',month:'Tháng này',lastmonth:'Tháng trước','30d':'30 ngày','90d':'90 ngày'};
function rangeDates(k){
  const t=sod(new Date()),add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
  if(k==='today')return [t,add(t,1)];
  if(k==='yesterday')return [add(t,-1),t];
  if(k==='7d')return [add(t,-6),add(t,1)];
  if(k==='30d')return [add(t,-29),add(t,1)];
  if(k==='90d')return [add(t,-89),add(t,1)];
  if(k==='lastmonth')return [new Date(t.getFullYear(),t.getMonth()-1,1),new Date(t.getFullYear(),t.getMonth(),1)];
  return [new Date(t.getFullYear(),t.getMonth(),1),add(t,1)];
}
// Dự án người này được chọn: toàn công ty thấy hết; theo dự án thấy dự án được gán.
const projOpts=ME.scope==='all'?CAT.projects:ME.scope==='project'?CAT.projects.filter(p=>(ME.project_ids||[]).includes(p.id)):[];
const F={proj:store.get('proj',''),mkt:store.get('mkt',''),ch:store.get('ch2','all'),range:store.get('range','month')};
if(F.proj&&!projOpts.some(p=>p.id===F.proj))F.proj='';
if(!RANGES[F.range])F.range='month';
if(F.ch!=='all'&&!byId(CAT.channels,F.ch))F.ch='all';
if(F.mkt&&!byId(CAT.markets,F.mkt))F.mkt='';
function scopeLabel(){
  if(ME.scope==='team')return 'Team '+esc(teamName(ME.team_id).replace(/^Team /,''));
  if(ME.scope==='self')return 'Số của '+esc(staffName(ME.staff_id));
  return '';
}
function renderFilters(){
  const pSel=projOpts.length?`<select id="fProj" aria-label="Dự án"><option value="">${ME.scope==='all'?'Tất cả dự án':'Tất cả dự án của tôi'}</option>${projOpts.map(p=>`<option value="${esc(p.id)}" ${F.proj===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:`<span class="pill p-mute">${scopeLabel()}</span>`;
  const mSel=CAT.markets.length>1?`<select id="fMkt" aria-label="Thị trường"><option value="">Mọi thị trường</option>${CAT.markets.map(m=>`<option value="${esc(m.id)}" ${F.mkt===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`:'';
  const rSel=`<select id="fRange" aria-label="Khoảng ngày">${Object.entries(RANGES).map(([k,v])=>`<option value="${k}" ${F.range===k?'selected':''}>${v}</option>`).join('')}</select>`;
  $('#filters').innerHTML=pSel+mSel+rSel;
  const hide=view==='caidat'||view==='canhbao';
  $('#filters2').hidden=hide||!CAT.channels.length;
  $('#filters2').innerHTML=`<div class="chips" role="group" aria-label="Lọc theo kênh"><button class="chip ${F.ch==='all'?'on':''}" data-ch="all">Tất cả kênh</button>${CAT.channels.map(c=>`<button class="chip ${F.ch===c.id?'on':''}" data-ch="${esc(c.id)}"><span class="ch"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</span></button>`).join('')}</div>`;
}

// ---------- dữ liệu ----------
// ROWS: đơn gộp theo ngày × team × nhân sự × kênh × thị trường × shop × nhóm trạng thái (dash_orders).
let ROWS=[],PRODS=null,loading=false,loadErr='',loadSeq=0;
async function loadData(){
  const seq=++loadSeq;loading=true;loadErr='';render();
  const [from,to]=rangeDates(F.range);
  const args={p_from:from.toISOString(),p_to:to.toISOString(),p_project:F.proj||null,p_market:F.mkt||null,p_channel:F.ch==='all'?null:F.ch};
  const {data,error}=await sbc.rpc('dash_orders',args);
  if(seq!==loadSeq)return;
  loading=false;
  if(error){loadErr=error.message;ROWS=[]}
  else ROWS=data.map(r=>({day:r.day,proj:r.project_id,team:r.team_id,staff:r.staff_id,mk:r.marketer,ch:r.channel_id,mkt:r.market_id,shop:r.shop_id,g:r.st_group,n:+r.orders,rev:+r.revenue_vnd}));
  PRODS=null;
  if(view==='sanpham'||view==='nhansu')loadProducts();
  render();
}
async function loadProducts(){
  const [from,to]=rangeDates(F.range);
  const {data,error}=await sbc.rpc('dash_products',{p_from:from.toISOString(),p_to:to.toISOString(),p_project:F.proj||null,p_market:F.mkt||null,p_channel:F.ch==='all'?null:F.ch});
  PRODS=error?{err:error.message,rows:[]}:{rows:data.map(r=>({code:r.code,name:r.name,team:r.team_id,staff:r.staff_id,g:r.st_group,n:+r.orders,qty:+r.qty,rev:+r.revenue_vnd}))};
  if(view==='sanpham'||view==='nhansu')render();
}
// Gộp: ord/rev = đơn chốt (trừ huỷ); ok = giao thành công; ret = hoàn; ship = đang giao; neu = chờ xử lý.
function agg(list,key){
  const m=new Map();
  list.forEach(r=>{const k=key(r);let a=m.get(k);if(!a){a={k,ord:0,rev:0,ok:0,okRev:0,ret:0,retRev:0,ship:0,shipRev:0,neu:0,cancel:0};m.set(k,a)}
    if(r.g==='cancel'){a.cancel+=r.n;return}
    a.ord+=r.n;a.rev+=r.rev;
    if(r.g==='ok'){a.ok+=r.n;a.okRev+=r.rev}else if(r.g==='ret'){a.ret+=r.n;a.retRev+=r.rev}else if(r.g==='ship'){a.ship+=r.n;a.shipRev+=r.rev}else a.neu+=r.n});
  return [...m.values()];
}
const ZERO={ord:0,rev:0,ok:0,okRev:0,ret:0,retRev:0,ship:0,shipRev:0,neu:0,cancel:0};
const tot=list=>agg(list,()=>'all')[0]||Object.assign({},ZERO);
const retRate=a=>(a.ok+a.ret)>0?a.ret/(a.ok+a.ret):NaN;
const retPill=r=>!isFinite(r)?'–':r>.35?`<span class="pill p-bad">${P(r)}</span>`:r>.25?`<span class="pill p-warn">${P(r)}</span>`:`<span class="pill p-good">${P(r)}</span>`;
function days(){const [f,t]=rangeDates(F.range);const out=[];for(let d=new Date(f);d<t;d.setDate(d.getDate()+1))out.push(new Date(d));return out}
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

// ---------- biểu đồ ----------
function dailyChart(list,h=220){
  const ds=days();if(ds.length<2)return '<p class="muted">Chọn khoảng từ 7 ngày trở lên để xem biểu đồ theo ngày.</p>';
  const by=new Map(agg(list,r=>r.day).map(a=>[a.k,a]));
  const pts=ds.map(d=>by.get(dkey(d))||Object.assign({k:dkey(d)},ZERO));
  const W=720,H=h,L=52,Rr=44,T=16,B=28,iw=W-L-Rr,ih=H-T-B,bw=iw/pts.length;
  const maxR=Math.max(1,...pts.map(p=>p.rev)),maxO=Math.max(1,...pts.map(p=>p.ord));
  const step=Math.pow(10,Math.floor(Math.log10(maxR)));const nice=[1,2,2.5,5,10].map(x=>x*step).find(x=>maxR/x<=5)||step*10;const top=Math.ceil(maxR/nice)*nice;
  const oStep=Math.max(1,Math.ceil(maxO/4));const oTop=oStep*4;
  const y=v=>T+ih-(v/top)*ih,yo=v=>T+ih-(v/oTop)*ih;
  let g='';
  for(let v=0;v<=top+1;v+=nice)g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1e9?(v/1e9).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tỷ':v>=1e6?Math.round(v/1e6)+' tr':v>0?Math.round(v/1e3)+'k':'0'}</text>`;
  for(let i=0;i<=4;i++)g+=`<text x="${W-Rr+8}" y="${yo(i*oStep)+4}" font-size="11" fill="var(--muted)">${N(i*oStep)}</text>`;
  const lp=[],every=Math.ceil(pts.length/8);
  pts.forEach((p,i)=>{const x=L+i*bw;const d=ds[i];
    g+=`<rect x="${x+bw*.15}" y="${y(p.rev)}" width="${Math.max(1,bw*.7)}" height="${T+ih-y(p.rev)}" rx="2" fill="var(--accent)" opacity=".3"><title>${fmtD(d)}: ${M(p.rev)} · ${N(p.ord)} đơn · hoàn ${P(retRate(p))}</title></rect>`;
    lp.push([x+bw/2,yo(p.ord)]);
    if(i%every===0||i===pts.length-1)g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtD(d)}</text>`});
  g+=`<polyline points="${lp.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`;
  const last=lp.at(-1);g+=`<circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--ink)"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Doanh số và số đơn theo ngày">${g}</svg>
  <div class="muted" style="font-size:12px;display:flex;gap:16px;flex-wrap:wrap;margin-top:6px"><span><span class="dot" style="background:var(--accent);opacity:.5;border-radius:2px"></span> Doanh số chốt (trục trái)</span><span>— Số đơn (trục phải)</span></div>`;
}
function spark(list){const ds=days();if(ds.length<2)return '';const by=new Map(agg(list,r=>r.day).map(a=>[a.k,a.rev]));const v=ds.map(d=>by.get(dkey(d))||0);const W=140,H=32,mx=Math.max(1,...v);const pts=v.map((x,i)=>[i/(v.length-1)*W,H-2-(x/mx)*(H-6)]);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polygon points="0,${H} ${pts.map(p=>p.join(',')).join(' ')} ${W},${H}" fill="var(--accent)" opacity=".12"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`}

function kpiBlock(a,extra=''){return `<div class="kpis">
  <div class="kpi"><div class="l">Doanh số chốt</div><div class="v">${M(a.rev)}</div><div class="n">${N(a.ord)} đơn (không tính huỷ)</div>${extra}</div>
  <div class="kpi"><div class="l">Giá trị TB / đơn</div><div class="v">${a.ord?N(a.rev/a.ord):'–'} đ</div><div class="n">${(()=>{const m=byId(CAT.markets,F.mkt)||(CAT.markets.length===1?CAT.markets[0]:null);return a.ord&&m?N(a.rev/a.ord/m.rate_vnd)+' '+esc(m.currency):''})()}</div></div>
  <div class="kpi"><div class="l">Giao thành công</div><div class="v">${N(a.ok)}</div><div class="n">${M(a.okRev)} · ${P(a.ok/((a.ok+a.ret)||NaN))} đơn đã xong</div></div>
  <div class="kpi"><div class="l">Tỷ lệ hoàn</div><div class="v">${P(retRate(a))}</div><div class="n">${N(a.ret)} đơn · ${M(a.retRev)}</div></div>
  <div class="kpi"><div class="l">Đang giao</div><div class="v">${N(a.ship)}</div><div class="n">${M(a.shipRev)} · ${N(a.neu)} chờ xử lý</div></div>
  <div class="kpi"><div class="l">Huỷ</div><div class="v">${N(a.cancel)}</div><div class="n">${P(a.cancel/((a.ord+a.cancel)||NaN))} tổng đơn</div></div>
</div>`}

function rankTable(list,keyFn,label,o={}){
  const g=agg(list,keyFn).sort((a,b)=>b.rev-a.rev),tt=tot(list);
  const head=`<th class="l">${label}</th>${o.extraHead||''}<th>Doanh số</th><th>Số đơn</th><th>TB/đơn</th><th>Giao TC</th><th>% hoàn</th><th>Đang giao</th>${o.spark?'<th>Theo ngày</th>':''}`;
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>
  ${g.map(a=>`<tr class="${o.click?'click':''}" ${o.click?`data-go="${esc(o.click(a.k))}"`:''}><td>${o.name?o.name(a.k):esc(a.k)}</td>${o.extraCell?o.extraCell(a.k,a):''}<td>${M(a.rev)}</td><td>${N(a.ord)}</td><td>${a.ord?N(a.rev/a.ord):'–'}</td><td>${N(a.ok)}</td><td>${retPill(retRate(a))}</td><td>${N(a.ship)}</td>${o.spark?`<td>${spark(list.filter(r=>keyFn(r)===a.k))}</td>`:''}</tr>`).join('')||`<tr><td colspan="9" class="l muted">Chưa có đơn trong khoảng này.</td></tr>`}
  </tbody>${g.length>1?`<tfoot><tr><td>Tổng</td>${o.extraHead?'<td></td>'.repeat((o.extraHead.match(/<th/g)||[]).length):''}<td>${M(tt.rev)}</td><td>${N(tt.ord)}</td><td>${tt.ord?N(tt.rev/tt.ord):'–'}</td><td>${N(tt.ok)}</td><td>${retPill(retRate(tt))}</td><td>${N(tt.ship)}</td>${o.spark?'<td></td>':''}</tr></tfoot>`:''}</table></div>`;
}
function legend(list,keyFn,nameFn,colorFn){
  const a=tot(list),g=agg(list,keyFn).sort((x,y)=>y.rev-x.rev);
  return `${colorFn?`<div class="mix">${g.map(c=>`<span style="width:${a.rev?c.rev/a.rev*100:0}%;background:${esc(colorFn(c.k))}"></span>`).join('')}</div>`:''}
  <div class="legend">${g.map(c=>`<div class="row"><span class="k">${nameFn(c.k)}</span><span>${M(c.rev)}</span><span class="s">${N(c.ord)} đơn</span></div>`).join('')||'<span class="muted">–</span>'}</div>`;
}
function empty(){
  if(loadErr)return `<div class="card"><p class="neg">Không tải được số liệu: ${esc(loadErr)}</p><p class="hint">Kiểm tra đã chạy file SQL 20261025000000_org_structure.sql trên Supabase chưa.</p></div>`;
  if(loading&&!ROWS.length)return `<div class="card"><p class="muted"><span class="spin"></span> Đang tải số liệu…</p></div>`;
  return `<div class="card"><h2>Chưa có đơn trong khoảng này</h2><p class="hint">${ME.scope==='self'&&!ME.staff_id?'Tài khoản chưa được liên kết với nhân sự nào, nhờ admin liên kết ở Quản trị → Tài khoản.':ME.scope==='all'?'Thử chọn khoảng ngày dài hơn, hoặc kiểm tra Quản trị → Kết nối POS đã có shop và key chưa.':'Thử chọn khoảng ngày dài hơn. Nếu vẫn trống, có thể marketer của cậu chưa được khai báo vào team (Quản trị → Chưa khai báo).'}</p></div>`;
}

// ---------- màn hình ----------
const V={};
V.tongquan=()=>{
  if(!ROWS.length)return empty();
  const a=tot(ROWS);
  const teamIds=[...new Set(ROWS.map(r=>r.team).filter(Boolean))];
  const target=F.range==='month'?CAT.teams.filter(t=>teamIds.includes(t.id)).reduce((s,t)=>s+(+t.target_vnd||0),0):0;
  const prog=target?`<div class="bar" title="Tiến độ so với target tháng"><i style="width:${Math.min(100,a.rev/target*100)}%"></i></div><div class="n">${P(a.rev/target)} target ${M(target)}</div>`:'';
  const multiProj=!F.proj&&new Set(ROWS.map(r=>r.proj)).size>1;
  return kpiBlock(a,prog)+`
  <div class="grid2">
    <div class="card"><h2>Doanh số và số đơn theo ngày</h2><p class="hint">Rê chuột lên cột để xem số từng ngày.</p>${dailyChart(ROWS,280)}</div>
    <div class="card"><h2>Theo kênh</h2><p class="hint">Nhận ra từ nguồn đơn trên POS.</p>${legend(ROWS,r=>r.ch,chTag,chColor)}
      ${multiProj?`<h2 style="margin-top:20px">Theo dự án</h2><div style="margin-top:8px">${legend(ROWS,r=>r.proj,k=>esc(projName(k)))}</div>`:''}

function prodTable(rows,withSearch){

}

function runJT(file){
  const out=$('#jtOut');if(!out)return;out.innerHTML='<p class="muted">Đang đọc file…</p>';
  const f=FFMS.find(x=>x.id===($('#jtFfm')||{}).value)||null;
  if(typeof XLSX==='undefined'){out.innerHTML='<p class="neg">Không tải được thư viện đọc Excel. Thử lưu file thành .csv rồi tải lại.</p>';return}
  const fr=new FileReader();
  fr.onload=e=>{try{
    const isCsv=/\.csv$/i.test(file.name);const wb=isCsv?XLSX.read(new TextDecoder('utf-8').decode(e.target.result).replace(/^﻿/,''),{type:'string'}):XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];const data=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!data.length){out.innerHTML='<p class="neg">File không có dòng dữ liệu nào.</p>';return}
    const keys=Object.keys(data[0]);const nk=k=>k.normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim();const find=(...c)=>keys.find(k=>c.some(x=>nk(k).includes(x.normalize('NFC'))));
    const kWb=find('waybill','mã vận đơn','ma van don'),kCod=find('cod'),kSt=find('order status','trạng thái','status'),kPr=find('tên sản phẩm','product','item');
    if(!kCod||!kSt){out.innerHTML=`<p class="neg">Không tìm thấy cột COD hoặc Order Status. Các cột trong file: ${esc(keys.join(', '))}.</p>`;return}
    const num=v=>{if(typeof v==='number')return v;const s=String(v).replace(/[^\d,.-]/g,'');return parseFloat(s.includes(',')&&!s.includes('.')?s.replace(',','.'):s.replace(/,/g,''))||0};
    const by={};const prod={};const seen=new Set();let dup=0;
    data.forEach(r=>{if(kWb){const w=String(r[kWb]).trim();if(w){if(seen.has(w)){dup++;return}seen.add(w)}}
      const st=String(r[kSt]).trim()||'(trống)';const cod=num(r[kCod]);
      (by[st]=by[st]||{n:0,cod:0});by[st].n++;by[st].cod+=cod;
      if(kPr){const p=String(r[kPr]).trim()||'(không tên)';(prod[p]=prod[p]||{n:0,del:0,ret:0});prod[p].n++;if(/deliver|giao|signed/i.test(st))prod[p].del++;if(/return|hoàn/i.test(st))prod[p].ret++}});
    const total=Object.values(by).reduce((s,x)=>s+x.n,0);
    const del=Object.entries(by).filter(([k])=>/deliver|giao|signed/i.test(k)).reduce((s,[,x])=>({n:s.n+x.n,cod:s.cod+x.cod}),{n:0,cod:0});
    const ret=Object.entries(by).filter(([k])=>/return|hoàn/i.test(k)).reduce((s,[,x])=>s+x.n,0);
    const svc=f?del.cod*(+f.feePct||0)/100:0, ship=f?total*(+f.shipPhp||0):0, net=del.cod-svc-ship;
    const tp=Object.entries(prod).sort((a,b)=>b[1].n-a[1].n).slice(0,15);
    out.innerHTML=`<div class="kpis"><div class="kpi"><div class="l">Vận đơn</div><div class="v">${N(total)}</div><div class="n">${dup?N(dup)+' dòng trùng mã đã bỏ':'không có dòng trùng'}</div></div>
      <div class="kpi"><div class="l">Giao thành công</div><div class="v">${N(del.n)}</div><div class="n">${P(del.n/total)}</div></div>
      <div class="kpi"><div class="l">Hoàn</div><div class="v">${N(ret)}</div><div class="n">${P(ret/((del.n+ret)||1))} trên đơn đã xong</div></div>
      <div class="kpi"><div class="l">COD đã giao</div><div class="v">${N(del.cod)} ₱</div><div class="n">≈ ${M(del.cod*PHP)}</div></div>
      ${f?`<div class="kpi"><div class="l">Tiền về dự kiến · ${esc(f.name)}</div><div class="v">${N(net)} ₱</div><div class="n">trừ phí ${PF(f.feePct)}% và cước ${PF(f.shipPhp)} ₱/đơn · ≈ ${M(net*PHP)}</div></div>`:''}</div>
      <div class="grid2"><div class="card" style="margin:0"><h2>Theo trạng thái</h2><div class="tw"><table><thead><tr><th class="l">Order Status</th><th>Số đơn</th><th>COD ₱</th></tr></thead><tbody>${Object.entries(by).sort((a,b)=>b[1].n-a[1].n).map(([k,x])=>`<tr><td class="l">${esc(k)}</td><td>${N(x.n)}</td><td>${N(x.cod)}</td></tr>`).join('')}</tbody></table></div></div>
      ${kPr?`<div class="card" style="margin:0"><h2>Tỷ lệ hoàn theo sản phẩm</h2><p class="hint">15 sản phẩm nhiều đơn nhất.</p><div class="tw"><table><thead><tr><th class="l">Sản phẩm</th><th>Đơn</th><th>% hoàn</th></tr></thead><tbody>${tp.map(([k,x])=>{const r=x.ret/((x.del+x.ret)||1);return `<tr><td class="l" style="white-space:normal">${esc(k)}</td><td>${N(x.n)}</td><td>${r>.3?`<span class="pill p-warn">${P(r)}</span>`:P(r)}</td></tr>`}).join('')}</tbody></table></div></div>`:''}</div>`;
  }catch(err){out.innerHTML=`<p class="neg">Không đọc được file: ${esc(err.message)}. Kiểm tra file là .xlsx hoặc .csv.</p>`}};
  fr.onerror=()=>{out.innerHTML='<p class="neg">Không đọc được file. Thử chọn lại.</p>'};
  fr.readAsArrayBuffer(file);
}

// ---------- cảnh báo ----------
let UNMAPPED=null;
function alerts(){
  const out=[];
  SHOPS.filter(s=>s.active!==false&&s.last_sync_status==='error').forEach(s=>out.push(['bad','Shop đồng bộ lỗi',`${s.name}: ${s.last_sync_error||''}`,ME.role==='admin'?'<a href="admin.html#pos">Xem</a>':'Báo admin']));
  if(UNMAPPED){const mk=UNMAPPED.filter(u=>u.kind==='marketer'),src=UNMAPPED.filter(u=>u.kind==='source');
    if(mk.length)out.push(['warn','Marketer chưa khai báo',`${mk.length} tên marketer (${N(mk.reduce((s,u)=>s+ +u.orders,0))} đơn) chưa thuộc team nào: ${mk.slice(0,4).map(u=>u.value).join(', ')}${mk.length>4?'…':''}`,'<a href="admin.html#chuakhaibao">Khai báo</a>']);
    if(src.length)out.push(['warn','Nguồn đơn chưa thuộc kênh',`${src.slice(0,4).map(u=>u.value).join(', ')}${src.length>4?'…':''}`,'<a href="admin.html#chuakhaibao">Gán kênh</a>'])}
  agg(ROWS.filter(r=>r.staff),r=>r.staff).forEach(a=>{const rr=retRate(a);if(a.ok+a.ret>=20&&rr>.35)out.push(['bad','Tỷ lệ hoàn cao',`${staffName(a.k)}: hoàn ${P(rr)} trên ${N(a.ok+a.ret)} đơn đã xong`,'Kiểm tra']);else if(a.ok+a.ret>=20&&rr>.28)out.push(['warn','Tỷ lệ hoàn đang tăng',`${staffName(a.k)}: hoàn ${P(rr)}`,'Theo dõi'])});
  if(F.range==='month'){const t=new Date(),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(),pace=t.getDate()/dim;
    agg(ROWS.filter(r=>r.team),r=>r.team).forEach(a=>{const tm=byId(CAT.teams,a.k);if(tm&&+tm.target_vnd&&a.rev/tm.target_vnd<pace-.15)out.push(['warn','Chậm target',`${tm.name}: đạt ${P(a.rev/tm.target_vnd)} target, đã qua ${P(pace,0)} tháng`,'Xem team'])})}
  const o={bad:0,warn:1,info:2};return out.sort((a,b)=>o[a[0]]-o[b[0]]);
}
V.canhbao=()=>{const a=alerts();return `<div class="card"><h2>${a.length} cảnh báo đang mở</h2><p class="hint">Tính từ dữ liệu POS theo bộ lọc đang chọn. Tỷ lệ hoàn chỉ xét nhân sự có từ 20 đơn đã xong.</p>
  <div class="alerts">${a.map(x=>`<div class="alert"><span class="stripe s-${x[0]}"></span><div><div class="t">${esc(x[1])}</div><div class="m">${esc(x[2])}</div></div><span class="pill ${x[0]==='bad'?'p-bad':x[0]==='warn'?'p-warn':'p-mute'}">${x[3]}</span></div>`).join('')||'<p class="muted">Không có cảnh báo.</p>'}</div></div>`};

// ---------- cài đặt: đơn vị FFM ----------
let db=null,dbState='loading',dbErr='',editFfm=null,delArm=null,formMsg={ffm:''};
const canFfm=['admin','quan_ly','ke_toan'].includes(ME.role);
V.caidat=()=>{
  const ef=editFfm?FFMS.find(f=>f.id===editFfm):null;
  return `<div class="card"><h2>Tài khoản của cậu</h2><p class="hint">Vai trò <b>${esc(Auth.ROLES[ME.role])}</b> · phạm vi xem <b>${esc(Auth.SCOPES[ME.scope||'self'])}</b>${ME.scope==='project'?': '+esc((ME.project_ids||[]).map(projName).join(', ')):ME.scope==='team'?': '+esc(teamName(ME.team_id)):ME.scope==='self'?': '+esc(staffName(ME.staff_id)):''}.
  ${ME.role==='admin'||ME.role==='quan_ly'?' Dự án, team, thị trường, kênh, nhân sự, shop POS quản lý ở <a href="admin.html">Quản trị</a>.':''}</p></div>
  <div class="card"><div class="cardhead"><div><h2>Đơn vị FFM</h2><p class="hint">Phí dịch vụ và cước dùng cho ô đối soát file ở màn KQKD.</p></div>${dbState==='ok'?'<span class="pill p-good">Đã lưu chung</span>':dbState==='loading'?'<span class="pill p-mute">Đang tải…</span>':'<span class="pill p-warn">Chưa lưu được</span>'}</div>
  <div class="tw"><table><thead><tr><th class="l">Đơn vị</th><th class="l">Kho trên POS</th><th>Phí dịch vụ (% COD)</th><th>Cước / đơn gửi (₱)</th><th class="l">Ghi chú</th><th></th></tr></thead><tbody>
  ${FFMS.map(f=>`<tr class="${editFfm===f.id?'editing':''}"><td class="l"><b>${esc(f.name)}</b></td><td class="l">${esc(f.warehouse)}</td><td>${PF(f.feePct)}%</td><td>${PF(f.shipPhp)}</td><td class="l muted" style="white-space:normal">${esc(f.note)}</td><td class="actions">${canFfm?`<button class="lnk" data-edit-ffm="${esc(f.id)}">Sửa</button><button class="lnk ${delArm==='f:'+f.id?'danger':''}" data-del-ffm="${esc(f.id)}">${delArm==='f:'+f.id?'Bấm lần nữa để xoá':'Xoá'}</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="l muted">Chưa có đơn vị FFM.</td></tr>'}
  </tbody></table></div>
  ${canFfm?`<form id="ffmForm" class="editor" novalidate>
    <div class="edtitle">${ef?'Sửa đơn vị: '+esc(ef.name):'Thêm đơn vị FFM'}</div>
    <div class="form">
      <label for="ffName">Tên đơn vị<input id="ffName" type="text" placeholder="VD: GIP" value="${ef?esc(ef.name):''}"></label>
      <label for="ffWh">Kho trên POS<input id="ffWh" type="text" value="${ef?esc(ef.warehouse):''}"></label>
      <label for="ffFee">Phí dịch vụ (% COD)<input id="ffFee" type="number" step="0.1" min="0" value="${ef?esc(ef.feePct):''}"></label>
      <label for="ffShip">Cước / đơn gửi (₱)<input id="ffShip" type="number" step="1" min="0" value="${ef?esc(ef.shipPhp):''}"></label>
      <label for="ffNote">Ghi chú<input id="ffNote" type="text" value="${ef?esc(ef.note):''}"></label>
    </div>
    <div class="formrow"><button class="btn" type="submit">${ef?'Lưu thay đổi':'Thêm đơn vị'}</button>${ef?'<button class="btn ghost" type="button" id="ffCancel">Huỷ</button>':''}<span class="fmsg" id="ffmMsg">${formMsg.ffm}</span></div>
  </form>`:''}</div>`;
};
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
async function submitFfm(){
  const name=val('ffName');
  if(!name){formMsg.ffm='<span class="neg">Nhập tên đơn vị.</span>';$('#ffmMsg').innerHTML=formMsg.ffm;return}
  const fee=parseFloat(val('ffFee')),ship=parseFloat(val('ffShip'));
  if(!(fee>=0)||!(ship>=0)){formMsg.ffm='<span class="neg">Điền phí dịch vụ và cước là số từ 0 trở lên.</span>';$('#ffmMsg').innerHTML=formMsg.ffm;return}
  const cur=editFfm?FFMS.find(f=>f.id===editFfm):null;
  const data={name,warehouse:val('ffWh'),feePct:fee,shipPhp:ship,share:cur?cur.share:0,note:val('ffNote')};
  const id=editFfm||(name.toLowerCase().replace(/[^a-z0-9]+/g,'')||'f'+Date.now().toString(36));
  if(!editFfm&&FFMS.some(f=>f.id===id)){formMsg.ffm='<span class="neg">Đã có đơn vị trùng tên.</span>';$('#ffmMsg').innerHTML=formMsg.ffm;return}
  try{await db.collection('ffm').doc(id).set(data);formMsg.ffm=`<span class="pos">${editFfm?'Đã lưu':'Đã thêm'} ${esc(name)}.</span>`;editFfm=null;render()}
  catch(e){formMsg.ffm=`<span class="neg">Chưa lưu được: ${esc(e.message||e)}.</span>`;$('#ffmMsg').innerHTML=formMsg.ffm}
}

// ---------- khung ----------
const TITLES={tongquan:['Tổng quan','Doanh số, đơn, giao hàng và hoàn'],team:['Team','Từng team và nhân sự trong team'],nhansu:['Nhân sự','Chỉ số từng người và sản phẩm đã bán'],sanpham:['Sản phẩm','Hiệu quả từng sản phẩm'],donhang:['Đơn hàng','Tra cứu đơn từ POS'],kqkd:['KQKD','Doanh thu theo team / dự án và đối soát file FFM'],canhbao:['Cảnh báo','Việc cần xử lý ngay'],caidat:['Cài đặt','Tài khoản và đơn vị FFM']};
let view='tongquan',keep={};
function snapForm(){const k={};document.querySelectorAll('#view input:not([type=file]),#view select').forEach(e=>{if(e.id)k[e.id]=e.value});k.__focus=document.activeElement&&document.activeElement.id;return k}
function render(){
  if(!V[view]||!ALLOWED.includes(view))view=ALLOWED[0];
  const before=snapForm();
  const scopeTxt=F.proj?projName(F.proj):ME.scope==='team'?teamName(ME.team_id):ME.scope==='self'?staffName(ME.staff_id):ME.scope==='project'&&projOpts.length===1?projOpts[0].name:'';
  const [f,t]=rangeDates(F.range);const last=new Date(t);last.setDate(last.getDate()-1);
  $('#title').textContent=TITLES[view][0];
  $('#subtitle').textContent=(scopeTxt?scopeTxt+' · ':'')+(view==='caidat'?TITLES[view][1]:`${fmtD(f)}${+last!==+f?' – '+fmtD(last):''}`);
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  renderFilters();
  $('#view').innerHTML=(catErr?`<div class="card"><p class="neg">Không đọc được danh mục: ${esc(catErr)}. Kiểm tra đã chạy file SQL 20261025000000_org_structure.sql chưa.</p></div>`:'')+V[view]();
  if(keep.__view===view){Object.keys(before).forEach(id=>{if(id==='__focus')return;const e=document.getElementById(id);if(e&&!['pq','oq','staffSel'].includes(id))e.value=before[id]});const fe=before.__focus&&document.getElementById(before.__focus);if(fe){fe.focus();if(fe.type==='search'||fe.type==='text')try{fe.setSelectionRange(fe.value.length,fe.value.length)}catch(x){}}}
  keep={__view:view};
  $('#alertCnt').textContent=alerts().filter(a=>a[0]==='bad').length;
}
function go(v){view=v;keep={};delArm=null;try{history.replaceState(null,'','#'+v)}catch(e){}if((v==='sanpham'||v==='nhansu')&&!PRODS)loadProducts();render();window.scrollTo(0,0)}
function setF(k,v){F[k]=v;store.set({proj:'proj',mkt:'mkt',ch:'ch2',range:'range'}[k],v);oPage=0;loadData()}
document.addEventListener('click',e=>{
  const n=e.target.closest('#nav a');if(n){e.preventDefault();go(n.dataset.v);return}
  const c=e.target.closest('[data-ch]');if(c){setF('ch',c.dataset.ch);return}
  const t=e.target.closest('[data-team]');if(t){curTeam=t.dataset.team;store.set('team',curTeam);render();return}
  const g=e.target.closest('[data-go]');if(g&&g.dataset.go){const i=g.dataset.go.indexOf(':');const v=g.dataset.go.slice(0,i),k=g.dataset.go.slice(i+1);if(v==='team'){curTeam=k;store.set('team',k)}if(v==='nhansu'){curStaff=k;store.set('staff',k)}if(ALLOWED.includes(v))go(v);return}
  const so=e.target.closest('[data-sort]');if(so){pSort=so.dataset.sort;store.set('psort2',pSort);render();return}
  const st=e.target.closest('[data-st]');if(st){oSt=st.dataset.st;oPage=0;render();return}
  if(e.target.id==='pPrev'){oPage--;render();return} if(e.target.id==='pNext'){oPage++;render();return}
  const ef=e.target.closest('[data-edit-ffm]');if(ef){editFfm=ef.dataset.editFfm;delArm=null;formMsg.ffm='';keep={};render();$('#ffmForm').scrollIntoView({block:'center'});$('#ffName').focus();return}
  if(e.target.id==='ffCancel'){editFfm=null;formMsg.ffm='';keep={};render();return}
  const df=e.target.closest('[data-del-ffm]');if(df){const id=df.dataset.delFfm;if(delArm==='f:'+id){delArm=null;const nm=(FFMS.find(f=>f.id===id)||{}).name;db.collection('ffm').doc(id).delete().then(()=>{formMsg.ffm=`<span class="muted">Đã xoá ${esc(nm)}.</span>`;if(editFfm===id)editFfm=null;render()}).catch(err=>{formMsg.ffm=`<span class="neg">Chưa xoá được: ${esc(err.message||err.code)}.</span>`;render()})}else{delArm='f:'+id;render()}return}
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='ffmForm')submitFfm()});
document.addEventListener('change',e=>{
  if(e.target.id==='fProj')setF('proj',e.target.value);
  if(e.target.id==='fMkt')setF('mkt',e.target.value);
  if(e.target.id==='fRange')setF('range',e.target.value);
  if(e.target.id==='staffSel'){curStaff=e.target.value;store.set('staff',curStaff);render()}
  if(e.target.id==='jtFile'&&e.target.files[0])runJT(e.target.files[0]);
});
function liveSearch(id,set){document.addEventListener('input',e=>{if(e.target.id!==id)return;set(e.target.value);const pos=e.target.selectionStart;render();const el=$('#'+id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(x){}}})}
liveSearch('pq',v=>pQ=v);liveSearch('oq',v=>{oQ=v;oPage=0});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.toggle('over',ev==='dragover');if(ev==='drop'&&e.dataTransfer.files[0])runJT(e.dataTransfer.files[0])}));

const h=(location.hash||'').slice(1);if(V[h])view=h;if(!ALLOWED.includes(view))view=ALLOWED[0];if(h!==view)try{history.replaceState(null,'','#'+view)}catch(e){}
render();loadData();
sbc.from('pos_shops').select('id,name,active,last_sync_status,last_sync_error').then(({data})=>{SHOPS=data||[]});
if(ME.role==='admin'||ME.role==='quan_ly')sbc.rpc('admin_unmapped').then(({data})=>{UNMAPPED=data||[];render()});

// Đơn vị FFM dùng chung (bảng ffm_units).
(async()=>{
  db=SettingsDB(sbc);
  db.collection('ffm').onSnapshot(s=>{FFMS=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(+b.share||0)-(+a.share||0));dbState='ok';if(view==='caidat'||view==='kqkd')render()},err=>{dbState='off';dbErr=err.code||'';render()});
})();

// ---------- cập nhật từ POS khi mở trang ----------
// Mở trang, quay lại tab, hoặc cứ 2 phút khi tab đang hiện: server kéo phần đơn mới nhất từ POS rồi trang tải lại số.
let lastRefresh=0,refreshing=false,freshAt=null,freshErr='';
const hhmm=t=>new Date(t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
function showFresh(){
  const el=$('#fresh');if(!el)return;
  const txt=refreshing?'<span class="spin" aria-hidden="true"></span>Đang lấy số mới nhất từ POS…'
    :freshErr?`<span class="neg">Không cập nhật được: ${esc(freshErr)}</span>`
    :freshAt?`Dữ liệu POS tính đến <b>${hhmm(freshAt)}</b>`:'Chưa có shop nào nối POS';
  el.innerHTML=txt+(refreshing?'':' <button class="lnk" id="refreshNow">Cập nhật ngay</button>');
}
async function refreshPOS(){
  if(refreshing)return;refreshing=true;showFresh();
  try{const r=await Auth.callFn('pos',{action:'refresh'});freshErr='';freshAt=r.synced_at}
  catch(e){freshErr=e.message}
  lastRefresh=Date.now();refreshing=false;showFresh();
  loadData();
}
document.addEventListener('click',e=>{if(e.target.id==='refreshNow')refreshPOS()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastRefresh>60000)refreshPOS()});
setInterval(()=>{if(document.visibilityState==='visible')refreshPOS()},120000);
refreshPOS();
})();
</script>
