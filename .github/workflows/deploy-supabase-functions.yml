# Tự deploy Edge Functions lên Supabase mỗi khi thư mục supabase/functions trên main thay đổi.
# Cần 2 secret trong repo (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN : tạo ở https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF  : mã dự án, phần đầu của Project URL (https://<mã>.supabase.co)
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml", ".github/workflows/deploy-supabase-functions.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Chưa đặt SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF, bỏ qua deploy."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: supabase/setup-cli@v1
        if: env.SKIP != '1'
        with:
          version: 2.40.7
      - name: Deploy
        if: env.SKIP != '1'
        run: supabase functions deploy admin-users pos --project-ref "$PROJECT_REF" --use-api
